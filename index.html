<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim SI</title>
  
  <meta property="og:title" content="Mekor Chaim Staten Island - Weekly Shiur">
  <meta property="og:description" content="Listen to weekly shiurim by Rabbi Zish Kohn.">
  <meta property="og:image" content="https://office212.github.io/rabbi_zish_kohn/icon-512(1).png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc; --card-bg: #ffffff; --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.1);
      --text-main: #0f172a; --text-muted: #64748b; --border-soft: #e2e8f0;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --fav-color: #ef4444; --watched-color: #10b981; --gold: #f59e0b;
    }
    body.dark-mode {
      --bg-main: #020617; --card-bg: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
      --border-soft: #1e293b; --accent: #60a5fa; --accent-glow: rgba(96, 165, 250, 0.15);
      --header-bg: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); padding-bottom: 100px; transition: background 0.3s ease; -webkit-tap-highlight-color: transparent; }
    header, main, footer { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 16px; }

    header { padding: 20px 16px; }
    .header-inner { background: var(--header-bg); border-radius: 24px; padding: 24px; color: white; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2); position: relative; }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 700; }
    .sub { font-size: 0.85rem; opacity: 0.9; margin: 4px 0 12px; }
    .header-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-btn { border-radius: 99px; font-size: 0.75rem; font-weight: 600; padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; transition: 0.2s; }
    
    .install-banner { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--card-bg); border-radius: 20px; padding: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); border: 1px solid var(--border-soft); display: none; align-items: center; gap: 15px; z-index: 10001; }
    .install-icon-box { background: var(--accent); color: white; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .player-card { background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); overflow: hidden; margin-bottom: 24px; position: relative; }
    .player-header { padding: 20px; border-bottom: 1px solid var(--border-soft); }
    .player-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; line-height: 1.4; }
    .player-meta { display: flex; justify-content: space-between; align-items: center; position: relative; }

    .share-container { position: relative; }
    .btn-share-pill { background: #eff6ff; color: #2563eb; padding: 10px 22px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; border: none; cursor: pointer; }
    .share-menu { position: absolute; top: 110%; right: 0; background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; flex-direction: column; min-width: 190px; z-index: 1000; overflow: hidden; }
    .share-menu.active { display: flex; }
    .share-option { background: none; border: none; padding: 14px 18px; text-align: left; font-size: 0.85rem; font-weight: 600; color: var(--text-main); border-bottom: 1px solid var(--border-soft); cursor: pointer; }

    .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .speed-btns { display: flex; gap: 8px; padding: 15px 20px; background: var(--bg-main); border-bottom: 1px solid var(--border-soft); overflow-x: auto; scrollbar-width: none; }
    .speed-btn { background: var(--card-bg); color: var(--text-muted); padding: 10px 16px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border-soft); cursor: pointer; }
    .speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .notes-section { padding: 20px; background: var(--bg-main); }
    .notes-actions { display: flex; gap: 8px; margin-bottom: 15px; }
    .tool-btn { padding: 10px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); cursor: pointer; }
    .tool-btn.primary { background: var(--accent); color: white; border: none; }
    .notes-input, .notes-display { width: 100%; min-height: 120px; padding: 14px; border-radius: 16px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.95rem; background: var(--card-bg); line-height: 1.6; }

    .list-header { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; width: 100%; }
    #search-input { flex: 1; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-main); outline: none; font-size: 1rem; }
    .fav-filter-btn { padding: 10px 22px; border-radius: 99px; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .fav-filter-btn.active { background: #fee2e2; border-color: #fecaca; color: #ef4444; }

    .empty-state { padding: 50px 20px; text-align: center; border: 2px dashed #cbd5e1; border-radius: 28px; background: var(--card-bg); margin-top: 20px; }
    .empty-state-icon { color: #ef4444; font-size: 2rem; margin-bottom: 10px; display: block; }

    .list { list-style: none; padding: 0; margin: 0; width: 100%; }
    .item { display: flex; gap: 16px; padding: 12px; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-soft); margin-bottom: 16px; align-items: center; box-shadow: var(--shadow-card); cursor: pointer; position: relative; }
    .item.active { border-color: var(--accent); background: var(--accent-glow); }
    .item-thumb { flex: 0 0 110px; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; background: #eee; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-progress-fill { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--watched-color); width: 0%; transition: width 0.3s; }
    .btn-fav-overlay { position: absolute; bottom: 6px; right: 6px; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; }
    .btn-fav-overlay.active svg { fill: var(--fav-color); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; }
    .overlay.active { display: flex !important; }
    .modal { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 30px; padding: 28px; position: relative; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; transition: 0.4s; z-index: 10001; opacity: 0; pointer-events: none; }
    .toast.show { opacity: 1; }

    footer { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 50px; padding: 20px 0 60px; }
    footer a { color: #2563eb !important; text-decoration: none !important; font-weight: 700 !important; }
  </style>
</head>
<body>

<div id="install-prompt" class="install-banner">
  <div class="install-icon-box">📲</div>
  <div class="install-text" id="install-text">התקן את האפליקציה לחוויה טובה יותר!</div>
  <button id="btn-do-install" style="background:var(--accent); color:white; border:none; padding:8px 15px; border-radius:10px; display:none;">התקן</button>
  <button onclick="document.getElementById('install-prompt').style.display='none'" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
</div>

<div id="driving-mode" class="overlay">
  <div style="color:#94a3b8; font-weight:600; margin-bottom:20px;" id="dm-title">No Shiur Playing</div>
  <div style="display:flex; gap:20px; align-items:center; margin:40px 0;">
    <button onclick="seek(-30)" class="nav-btn" style="width:70px; height:70px; border-radius:50%; background:#1e293b; color:white;">-30s</button>
    <button onclick="togglePlay()" class="nav-btn" style="width:100px; height:100px; border-radius:50%; background:var(--accent); color:white;"><svg id="dm-play-icon" width="45" height="45" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button onclick="seek(30)" class="nav-btn" style="width:70px; height:70px; border-radius:50%; background:#1e293b; color:white;">+30s</button>
  </div>
  <button style="background:#334155; color:white; padding:12px 35px; border-radius:99px; border:none; cursor:pointer; font-weight:700;" onclick="toggleDrivingMode()">Exit Mode</button>
</div>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim SI</h1>
    <div class="sub">Weekly Shiurim - Rabbi Zish Kohn</div>
    <div class="header-controls">
      <button onclick="openStats()" class="nav-btn stats-btn">📊 Stats</button>
      <button onclick="toggleDrivingMode()" class="nav-btn drive-mode-btn">🚗 Audio Mode</button>
      <button id="theme-toggle-btn" class="nav-btn theme-toggle"><span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span></button>
    </div>
  </div>
</header>

<main>
  <div class="player-card" id="player-card">
    <div id="skeleton" style="height:200px; background:#eee; border-radius:24px; margin:20px;"></div>
    <div id="player-content" style="display:none">
      <div class="player-header">
        <h2 class="player-title" id="player-title">Select a shiur</h2>
        <div class="player-meta">
          <span style="background:var(--accent-glow); color:var(--accent); padding:5px 12px; border-radius:8px; font-size:0.7rem; font-weight:700;">TORAH</span>
          <div class="share-container">
            <button onclick="toggleShareMenu(event)" class="btn-share-pill">Share</button>
            <div id="share-dropdown" class="share-menu">
              <button class="share-option" onclick="shareCurrent(false)">🔗 Copy App Link</button>
              <button class="share-option" onclick="shareCurrent(true)">⏱️ Link at Current Time</button>
            </div>
          </div>
        </div>
      </div>
      <div class="video-container"><div id="player-placeholder"></div></div>
      <div class="speed-btns">
          <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
          <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25x</button>
          <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5x</button>
          <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
      </div>
      <div class="notes-section">
        <div class="notes-actions">
          <button onclick="toggleNoteMode()" id="note-mode-btn" class="tool-btn primary">👁️ View</button>
          <button onclick="insertTimestamp()" class="tool-btn">⏱️ Time</button>
          <button onclick="openQuoteCreator()" class="tool-btn">🎨 Quote</button>
        </div>
        <textarea id="notes-input" class="notes-input" placeholder="Notes autosave..."></textarea>
        <div id="notes-display" class="notes-display"></div>
      </div>
    </div>
  </div>

  <div class="list-header">
    <input id="search-input" type="search" placeholder="Search topics..." oninput="renderList()">
    <button id="fav-filter-btn" class="fav-filter-btn" onclick="toggleFavFilter()">Saved ❤️</button>
  </div>
  <ul id="shiur-list" class="list"></ul>
</main>

<footer>&copy; 2026 Mekor Chaim SI • Built by <a href="mailto:ccdesign.nys@gmail.com">CC Design</a></footer>
<div id="toast" class="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I";
  const PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";

  const appState = {
    allData: [], currentId: null, showFavoritesOnly: false, isNoteEditMode: true,
    favorites: new Set(JSON.parse(localStorage.getItem('mc_favorites') || '[]')),
    progress: JSON.parse(localStorage.getItem('mc_progress') || '{}'),
    notes: JSON.parse(localStorage.getItem('mc_notes') || '{}'),
    save() {
      localStorage.setItem('mc_favorites', JSON.stringify([...this.favorites]));
      localStorage.setItem('mc_progress', JSON.stringify(this.progress));
      localStorage.setItem('mc_notes', JSON.stringify(this.notes));
    }
  };

  let player = null, progressInterval = null;

  function onYouTubeIframeAPIReady() { initApp(); }

  async function initApp() {
    await fetchAllData();
    player = new YT.Player('player-placeholder', {
      height: '100%', width: '100%', videoId: '',
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1 },
      events: { 'onStateChange': onPlayerStateChange }
    });
    applySavedTheme();
    document.getElementById('theme-toggle-btn').onclick = toggleTheme;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  async function fetchAllData(token = "", acc = []) {
    try {
      const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}&pageToken=${token}`;
      const res = await fetch(url);
      const data = await res.json();
      acc.push(...data.items);
      if (data.nextPageToken) return fetchAllData(data.nextPageToken, acc);
      appState.allData = acc.map(item => ({ id: item.contentDetails.videoId, title: item.snippet.title }));
      renderList(); 
      document.getElementById("skeleton").style.display = "none"; 
      document.getElementById("player-content").style.display = "block";
    } catch(e) { console.error(e); }
  }

  function playVideo(id, autoScroll) {
    appState.currentId = id;
    const item = appState.allData.find(d => d.id === id);
    document.getElementById("player-title").textContent = item.title;
    player.loadVideoById(id);
    document.getElementById("notes-input").value = appState.notes[id] || "";
    renderList();
    if(autoScroll) window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      progressInterval = setInterval(() => {
        const t = Math.floor(player.getCurrentTime());
        appState.progress[appState.currentId] = t;
        appState.save();
        const bar = document.querySelector(`.item[data-id="${appState.currentId}"] .item-progress-fill`);
        if(bar) bar.style.width = (t/player.getDuration())*100 + '%';
      }, 1000);
    } else { clearInterval(progressInterval); }
  }

  function renderList() {
    const list = document.getElementById("shiur-list"), filter = document.getElementById("search-input").value.toLowerCase();
    list.innerHTML = "";
    const filtered = appState.allData.filter(i => i.title.toLowerCase().includes(filter) && (!appState.showFavoritesOnly || appState.favorites.has(i.id)));
    
    if (appState.showFavoritesOnly && filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><span class="empty-state-icon">❤️</span><div class="empty-state-text">No saved shiurim.<br>Tap the heart to save.</div></div>`;
      return;
    }

    filtered.forEach(item => {
      const li = document.createElement("li");
      li.className = `item ${item.id === appState.currentId ? 'active' : ''}`;
      li.dataset.id = item.id;
      li.innerHTML = `
        <div class="item-thumb"><img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg">
          <button class="btn-fav-overlay ${appState.favorites.has(item.id)?'active':''}" onclick="event.stopPropagation(); toggleFav('${item.id}')"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
          <div class="item-progress-fill"></div>
        </div>
        <div class="item-body"><div class="item-title">${item.title}</div></div>`;
      li.onclick = () => playVideo(item.id, true);
      list.appendChild(li);
    });
  }

  function setSpeed(s, btn) { player.setPlaybackRate(s); document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
  function toggleFav(id) { appState.favorites.has(id) ? appState.favorites.delete(id) : appState.favorites.add(id); appState.save(); renderList(); }
  function toggleFavFilter() { appState.showFavoritesOnly = !appState.showFavoritesOnly; document.getElementById("fav-filter-btn").classList.toggle('active'); renderList(); }
  function toggleShareMenu(e) { e.stopPropagation(); document.getElementById("share-dropdown").classList.toggle("active"); }
  window.onclick = () => document.getElementById("share-dropdown").classList.remove("active");

  function shareCurrent(withTime) {
    const item = appState.allData.find(d => d.id === appState.currentId); if(!item) return;
    let url = window.location.origin + window.location.pathname + '?v=' + item.id;
    if(withTime) url += '&t=' + Math.floor(player.getCurrentTime());
    navigator.share ? navigator.share({title: item.title, url: url}) : (navigator.clipboard.writeText(url), showToast("Link Copied!"));
  }

  function toggleTheme() {
    const isDark = document.body.classList.toggle("dark-mode");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
    document.getElementById("theme-text").textContent = isDark ? "Light Mode" : "Dark Mode";
  }
  function applySavedTheme() { if(localStorage.getItem("theme") === "dark") toggleTheme(); }
  function insertTimestamp() { const t = Math.floor(player.getCurrentTime()); document.getElementById("notes-input").value += `[${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}] `; }
  function toggleNoteMode() { appState.isNoteEditMode = !appState.isNoteEditMode; document.getElementById("notes-input").style.display = appState.isNoteEditMode ? "block" : "none"; document.getElementById("notes-display").style.display = appState.isNoteEditMode ? "none" : "block"; if(!appState.isNoteEditMode) document.getElementById("notes-display").textContent = document.getElementById("notes-input").value; }
  function toggleDrivingMode() { document.getElementById("driving-mode").classList.toggle("active"); if(appState.currentId) document.getElementById("dm-title").textContent = appState.allData.find(d => d.id === appState.currentId).title; }
  function togglePlay() { player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
  function seek(s) { player.seekTo(player.getCurrentTime() + s, true); }
  function showToast(m) { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3000); }
</script>
</body>
</html>
