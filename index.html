<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim SI</title>
  
  <meta property="og:title" content="Mekor Chaim Staten Island - Weekly Shiur">
  <meta property="og:description" content="Listen to weekly shiurim by Rabbi Zish Kohn.">
  <meta property="og:image" content="https://office212.github.io/rabbi_zish_kohn/icon-512(1).png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc; --card-bg: #ffffff; --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.1);
      --text-main: #0f172a; --text-muted: #64748b; --border-soft: #e2e8f0;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --fav-color: #ef4444; --watched-color: #10b981;
    }
    body.dark-mode {
      --bg-main: #020617; --card-bg: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
      --border-soft: #1e293b; --accent: #60a5fa; --accent-glow: rgba(96, 165, 250, 0.15);
      --header-bg: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); padding-bottom: 80px; transition: background 0.3s ease, color 0.3s ease; -webkit-tap-highlight-color: transparent; }
    header, main, footer { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 16px; }

    header { padding-top: 20px; padding-bottom: 20px; }
    .header-inner { background: var(--header-bg); border-radius: 24px; padding: 24px; color: white; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2); }
    .header-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
    .nav-btn { border-radius: 99px; font-size: 0.75rem; font-weight: 600; padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
    .theme-toggle { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
    .stats-btn { background: white; color: var(--accent); }
    .drive-mode-btn { background: rgba(0,0,0,0.25); color: white; }

    .player-card { background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); overflow: hidden; margin-bottom: 24px; }
    .player-header { padding: 20px; border-bottom: 1px solid var(--border-soft); }
    .player-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; line-height: 1.4; }
    .player-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .badge-main { background: var(--accent-glow); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    
    .share-container { position: relative; }
    .share-btn { background: #ecfdf5; color: #059669; border: 1px solid #d1fae5; border-radius: 99px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
    .share-menu { position: absolute; top: 100%; right: 0; margin-top: 8px; background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); display: none; flex-direction: column; min-width: 170px; z-index: 50; }
    .share-menu.show { display: flex; }
    .share-menu button { background: none; border: none; padding: 12px; text-align: left; cursor: pointer; font-size: 0.85rem; color: var(--text-main); border-bottom: 1px solid var(--border-soft); }

    .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .speed-btns { display: flex; gap: 6px; padding: 15px 20px; background: var(--bg-main); border-bottom: 1px solid var(--border-soft); }
    .speed-btn { background: var(--card-bg); color: var(--text-muted); padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border-soft); cursor: pointer; }
    .speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .notes-section { padding: 20px; background: var(--bg-main); }
    .notes-actions { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; scrollbar-width: none; }
    .tool-btn { padding: 10px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); white-space: nowrap; border: none; cursor: pointer; }
    .tool-btn.primary { background: var(--accent); color: white; }
    .tool-btn.highlight { background: #fef3c7; color: #d97706; border-color: #fcd34d; }
    
    .notes-input, .notes-display { width: 100%; min-height: 120px; padding: 14px; border-radius: 16px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.95rem; background: var(--card-bg); line-height: 1.6; }
    .notes-display { display: none; white-space: pre-wrap; }
    .ts-link { color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; background: var(--accent-glow); padding: 2px 4px; border-radius: 4px; }

    .list-header { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    #search-input { flex: 1; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-main); outline: none; font-size: 1rem; }
    .fav-filter-btn { padding: 12px 16px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
    .fav-filter-btn.active { color: var(--fav-color); border-color: var(--fav-color); background: #fff1f2; }

    .list { list-style: none; padding: 0; margin: 0; width: 100%; }
    .item { display: flex; gap: 16px; padding: 12px; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-soft); margin-bottom: 16px; transition: 0.2s; align-items: center; box-shadow: var(--shadow-card); cursor: pointer; }
    .item.active { border-color: var(--accent); background: var(--accent-glow); }
    .item-thumb { flex: 0 0 120px; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .btn-fav-overlay { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; cursor: pointer; }
    .btn-fav-overlay svg { width: 18px; height: 18px; fill: #cbd5e1; }
    .btn-fav-overlay.active svg { fill: var(--fav-color); }
    .item-progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.1); }
    .item-progress-fill { height: 100%; background: var(--watched-color); width: 0%; transition: width 0.3s; }
    .item-body { flex: 1; min-width: 0; }
    .item-title { font-size: 0.95rem; font-weight: 700; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-date { font-size: 0.8rem; color: var(--text-muted); }

    /* EMPTY STATE STYLE */
    .empty-state { padding: 40px 20px; text-align: center; width: 100%; border: 2px dashed var(--border-soft); border-radius: 24px; background: var(--card-bg); margin-top: 10px; }
    .empty-state-icon { font-size: 3rem; margin-bottom: 15px; display: block; }
    .empty-state-text { font-size: 1rem; color: var(--text-muted); line-height: 1.6; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; }
    .overlay.active { display: flex !important; }
    .modal { background: var(--card-bg); width: 100%; max-width: 380px; border-radius: 28px; padding: 24px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: transparent; color: var(--text-muted); font-size: 1.2rem; border: none; cursor: pointer; }
    #driving-mode { background: #000; flex-direction: column; }
    .dm-controls { display: flex; gap: 20px; align-items: center; margin: 40px 0; }
    .dm-btn { width: 80px; height: 80px; border-radius: 50%; background: #1e293b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
    .dm-btn.play { width: 100px; height: 100px; background: var(--accent); border: none; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; transition: 0.4s; z-index: 10001; opacity: 0; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* FOOTER FIXED CLICKABILITY */
    footer { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 50px; padding: 20px 0 60px; position: relative; z-index: 10; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; pointer-events: auto; }
  </style>
</head>
<body>

<div id="driving-mode" class="overlay">
  <div style="color: #94a3b8; text-align: center; margin-bottom: 20px; font-weight: 600;" id="dm-title">No Shiur Playing</div>
  <div class="dm-controls">
    <button class="dm-btn" onclick="seek(-30)"><svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span>-30s</span></button>
    <button class="dm-btn play" onclick="togglePlay()"><svg id="dm-play-icon" width="40" height="40" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="dm-btn" onclick="seek(30)"><svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg><span>+30s</span></button>
  </div>
  <button style="background:#334155; color:white; padding:12px 30px; border-radius:99px; border:none; cursor:pointer;" onclick="toggleDrivingMode()">Exit</button>
</div>

<div id="stats-overlay" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeOverlay('stats-overlay')">✕</button>
    <h3 style="text-align:center; margin-top:0;">My Torah Stats 📊</h3>
    <div style="display:flex; justify-content:space-around; text-align:center; margin-top:20px;">
      <div><span id="stat-streak" style="font-size:1.6rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Streak</span></div>
      <div><span id="stat-hours" style="font-size:1.6rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Hours</span></div>
      <div><span id="stat-completed" style="font-size:1.6rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Watched</span></div>
    </div>
  </div>
</div>

<div id="quote-overlay" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeOverlay('quote-overlay')">✕</button>
    <h3 style="margin:0; text-align:center;">Share a Quote 🎨</h3>
    <textarea id="quote-text" style="width:100%; height:100px; margin:20px 0; border-radius:12px; padding:12px; border:1px solid var(--border-soft); font-family:inherit;" placeholder="Type quote here..."></textarea>
    <button onclick="generateAndShareQuote()" style="width:100%; background:var(--accent); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; cursor:pointer;">Share</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim SI</h1>
    <div class="header-controls">
      <button onclick="openStats()" class="nav-btn stats-btn">📊 Stats</button>
      <button onclick="toggleDrivingMode()" class="nav-btn drive-mode-btn">🚗 Audio Mode</button>
      <button id="theme-toggle" class="nav-btn theme-toggle"><span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span></button>
    </div>
  </div>
</header>

<main>
  <div class="layout">
    <section class="player-card" id="player-card">
      <div id="skeleton" class="skeleton-wrapper"><div class="skel-video"></div></div>
      <div id="player-content" style="display:none">
        <div class="player-header">
          <h2 class="player-title" id="player-title">Select a shiur</h2>
          <div class="player-meta">
            <div><span class="badge-main">Torah</span> <span id="player-date" style="font-size:0.8rem; color:var(--text-muted); margin-left:8px;"></span></div>
            <div class="share-container">
              <button onclick="toggleShareMenu()" class="share-btn">Share</button>
              <div id="share-menu" class="share-menu">
                <button onclick="shareLink(false)">Link</button>
                <button onclick="shareLink(true)">At Current Time ⏱️</button>
              </div>
            </div>
          </div>
        </div>
        <div class="video-container"><div id="player-placeholder"></div></div>
        <div class="speed-btns">
            <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
            <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25x</button>
            <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5x</button>
            <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
        </div>
        <div class="notes-section">
          <div class="notes-actions">
            <button onclick="toggleNoteMode()" id="note-mode-btn" class="tool-btn primary">👁️ View</button>
            <button onclick="insertTimestamp()" id="time-btn" class="tool-btn">⏱️ Time</button>
            <button onclick="openQuoteCreator()" class="tool-btn highlight">🎨 Quote</button>
            <button onclick="exportNotes()" class="tool-btn">💾 Export</button>
          </div>
          <textarea id="notes-input" class="notes-input" placeholder="Type notes... use 'Time' for bookmarks."></textarea>
          <div id="notes-display" class="notes-display"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="list-header">
        <input id="search-input" type="search" placeholder="Search shiurim...">
        <button id="fav-btn" class="fav-filter-btn" onclick="toggleFavFilter()">Saved ❤️</button>
      </div>
      <ul id="shiur-list" class="list"></ul>
    </section>
  </div>
</main>

<footer>&copy; 2026 Mekor Chaim SI • Built by <a href="mailto:ccdesign.nys@gmail.com">CC Design</a></footer>
<div id="toast" class="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I";
  const PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";

  let allData = [], currentId = null, player = null, progressInterval = null;
  let isNoteEditMode = true, isDrivingMode = false, showFavoritesOnly = false;
  
  let favorites = new Set(JSON.parse(localStorage.getItem('mc_favorites') || '[]'));
  let progressMap = JSON.parse(localStorage.getItem('mc_progress') || '{}');
  let watchedHistory = new Set(JSON.parse(localStorage.getItem('mc_watched') || '[]'));
  let notesMap = JSON.parse(localStorage.getItem('mc_notes') || '{}');
  let stats = JSON.parse(localStorage.getItem('mc_stats') || '{"totalSeconds":0, "streak":0, "lastVisit":""}');

  function onYouTubeIframeAPIReady() { initApp(); }

  async function initApp() {
    await loadData();
    player = new YT.Player('player-placeholder', {
      height: '100%', width: '100%', videoId: '',
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1, 'enablejsapi': 1 },
      events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
    });
    updateStreak(); applySavedTheme();
  }

  function onPlayerReady() {
    const urlParams = new URLSearchParams(window.location.search);
    const v = urlParams.get('v');
    if (v) playVideo(v, false, parseInt(urlParams.get('t')) || 0);
    else if (localStorage.getItem('lastWatched')) playVideo(localStorage.getItem('lastWatched'), false);
  }

  function playVideo(id, autoScroll, time = null) {
    currentId = id; localStorage.setItem('lastWatched', id);
    const item = allData.find(d => d.id === id);
    if(!item) return;
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    loadNotes(id);
    let start = (time !== null) ? time : (progressMap[id] || 0);
    if (player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: start });
    renderList(allData);
    if(autoScroll) {
      const card = document.getElementById("player-card");
      window.scrollTo({top: card.getBoundingClientRect().top + window.pageYOffset - 20, behavior: 'smooth'});
    }
  }

  function loadNotes(id) {
    const text = notesMap[id] || "";
    document.getElementById("notes-input").value = text;
    updateNotesDisplay(text);
  }

  function updateNotesDisplay(text) {
    const html = text.replace(/\[(\d+):(\d+)\]/g, (match, m, s) => {
        const total = parseInt(m) * 60 + parseInt(s);
        return `<span class="ts-link" onclick="seekTo(${total})">${match}</span>`;
    });
    document.getElementById("notes-display").innerHTML = html || "No notes yet.";
  }

  window.toggleNoteMode = function() {
    isNoteEditMode = !isNoteEditMode;
    const input = document.getElementById("notes-input"), display = document.getElementById("notes-display"), btn = document.getElementById("note-mode-btn"), timeBtn = document.getElementById("time-btn");
    if(isNoteEditMode) { input.style.display = 'block'; display.style.display = 'none'; btn.innerHTML = '👁️ View'; timeBtn.style.display = 'flex'; } 
    else { updateNotesDisplay(input.value); input.style.display = 'none'; display.style.display = 'block'; btn.innerHTML = '✏️ Edit'; timeBtn.style.display = 'none'; }
  }

  window.insertTimestamp = function() {
    if(!player) return;
    const t = Math.floor(player.getCurrentTime());
    const ts = `[${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}] `;
    document.getElementById("notes-input").value += ts;
    notesMap[currentId] = document.getElementById("notes-input").value;
    localStorage.setItem('mc_notes', JSON.stringify(notesMap));
  }

  window.seekTo = function(sec) { if(player) { player.seekTo(sec, true); player.playVideo(); } }

  window.exportNotes = function() {
    const text = notesMap[currentId] || "";
    if(!text) { showToast("Nothing to export"); return; }
    const title = allData.find(d => d.id === currentId)?.title || "Notes";
    const fullText = `Shiur: ${title}\n\n${text}`;
    const blob = new Blob([fullText], {type: 'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'notes.txt'; a.click();
    showToast("Downloaded!");
  }

  async function loadData() {
    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}`);
      const data = await res.json();
      allData = data.items.map(item => ({
        id: item.contentDetails.videoId, title: item.snippet.title,
        dateNice: new Date(item.contentDetails.videoPublishedAt).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"})
      }));
      renderList(allData);
      document.getElementById("skeleton").style.display = "none";
      document.getElementById("player-content").style.display = "block";
    } catch(e) { console.error(e); }
  }

  function renderList(items) {
    const list = document.getElementById("shiur-list");
    list.innerHTML = "";
    const filter = document.getElementById("search-input").value.toLowerCase();
    
    let filtered = items.filter(item => {
      const matchesSearch = item.title.toLowerCase().includes(filter);
      const matchesFav = !showFavoritesOnly || favorites.has(item.id);
      return matchesSearch && matchesFav;
    });

    // FIXED: Show empty state ONLY when favorites filter is on and nothing found
    if (showFavoritesOnly && filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="empty-state-icon">❤️</span>
          <div class="empty-state-text">
            <strong>You haven't saved any shiurim yet.</strong><br>
            Tap the heart icon ❤️ on a shiur to add it to your favorites.
          </div>
        </div>`;
      return;
    } else if (filtered.length === 0) {
      list.innerHTML = `<li style="text-align:center; padding:20px; color:var(--text-muted)">No shiurim found.</li>`;
      return;
    }

    filtered.forEach(item => {
      const li = document.createElement("li");
      const prog = (progressMap[item.id] || 0) / 2700 * 100;
      li.className = `item ${item.id === currentId ? 'active' : ''}`;
      li.innerHTML = `
        <div class="item-thumb"><img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg"><div class="btn-fav-overlay ${favorites.has(item.id)?'active':''}" onclick="event.stopPropagation(); toggleFav('${item.id}')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><div class="item-progress-container"><div class="item-progress-fill" style="width:${Math.min(prog,100)}%"></div></div></div>
        <div class="item-body"><div class="item-title">${item.title}</div><div class="item-date">${item.dateNice}</div></div>`;
      li.onclick = () => playVideo(item.id, true);
      list.appendChild(li);
    });
  }

  window.toggleFav = function(id) { if(favorites.has(id)) favorites.delete(id); else favorites.add(id); localStorage.setItem('mc_favorites', JSON.stringify([...favorites])); renderList(allData); }
  window.toggleFavFilter = function() { showFavoritesOnly = !showFavoritesOnly; document.getElementById("fav-btn").classList.toggle('active'); renderList(allData); }
  
  function onPlayerStateChange(e) {
    if (e.data === 1) {
      progressInterval = setInterval(() => {
        const t = Math.floor(player.getCurrentTime());
        if(t > 5) { progressMap[currentId] = t; localStorage.setItem('mc_progress', JSON.stringify(progressMap)); stats.totalSeconds += 5; localStorage.setItem('mc_stats', JSON.stringify(stats)); renderList(allData); }
      }, 5000);
      document.getElementById("dm-play-icon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      watchedHistory.add(currentId); localStorage.setItem('mc_watched', JSON.stringify([...watchedHistory]));
    } else { clearInterval(progressInterval); document.getElementById("dm-play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>'; }
  }

  window.setSpeed = function(s, btn) { player.setPlaybackRate(s); document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
  window.toggleDrivingMode = function() { isDrivingMode = !isDrivingMode; document.getElementById("driving-mode").classList.toggle('active'); document.getElementById("dm-title").textContent = allData.find(d => d.id === currentId)?.title || "No Shiur"; }
  window.togglePlay = function() { player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
  window.seek = function(s) { player.seekTo(player.getCurrentTime() + s, true); }
  window.openStats = function() { document.getElementById('stat-streak').textContent = stats.streak; document.getElementById('stat-hours').textContent = (stats.totalSeconds/3600).toFixed(1); document.getElementById('stat-completed').textContent = watchedHistory.size; document.getElementById('stats-overlay').classList.add('active'); }
  window.closeOverlay = (id) => document.getElementById(id).classList.remove('active');
  window.toggleShareMenu = () => document.getElementById("share-menu").classList.toggle("show");
  window.shareLink = (t) => {
    let url = window.location.origin + window.location.pathname + '?v=' + currentId;
    if(t && player) url += '&t=' + Math.floor(player.getCurrentTime());
    navigator.clipboard.writeText(url); showToast("Link Copied!"); document.getElementById("share-menu").classList.remove("show");
  }

  window.openQuoteCreator = () => document.getElementById('quote-overlay').classList.add('active');
  window.generateAndShareQuote = function() {
    const text = document.getElementById('quote-text').value;
    if(!text.trim()) { showToast("Type quote first"); return; }
    const canvas = document.createElement('canvas'); canvas.width = 1080; canvas.height = 1080; const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 1080); gradient.addColorStop(0, '#1e3a8a'); gradient.addColorStop(1, '#172554'); ctx.fillStyle = gradient; ctx.fillRect(0,0,1080,1080);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 10; ctx.strokeRect(40,40,1000,1000);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 60px Inter, sans-serif'; ctx.textAlign = 'center';
    wrapText(ctx, text, 540, 400, 900, 80);
    ctx.fillStyle = '#93c5fd'; ctx.font = '40px Inter, sans-serif'; ctx.fillText("Rabbi Zish Kohn", 540, 800);
    ctx.font = '30px Inter, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText("Mekor Chaim Staten Island", 540, 900);
    canvas.toBlob(blob => {
        const file = new File([blob], "quote.png", {type: "image/png"});
        if(navigator.share) navigator.share({files: [file]}).catch(console.error);
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'quote.png'; a.click(); }
        closeOverlay('quote-overlay');
    });
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' '); let line = '';
    for(let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) { ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight; } else { line = testLine; }
    } ctx.fillText(line, x, y);
  }

  // FIXED THEME LOGIC
  document.getElementById("theme-toggle").onclick = () => {
    const isDarkNow = document.body.classList.toggle("dark-mode");
    localStorage.setItem("theme", isDarkNow ? "dark" : "light");
    updateThemeUI(isDarkNow);
  };
  function applySavedTheme() {
    const isDark = localStorage.getItem("theme") === "dark";
    document.body.classList.toggle("dark-mode", isDark);
    updateThemeUI(isDark);
  }
  function updateThemeUI(isDark) {
    document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
    document.getElementById("theme-text").textContent = isDark ? "Light Mode" : "Dark Mode";
  }

  function updateStreak() { const today = new Date().toISOString().split('T')[0]; if (stats.lastVisit !== today) { stats.streak = (stats.lastVisit === new Date(Date.now()-86400000).toISOString().split('T')[0]) ? stats.streak + 1 : 1; stats.lastVisit = today; localStorage.setItem('mc_stats', JSON.stringify(stats)); } }
  function showToast(m) { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
  document.getElementById("search-input").oninput = () => renderList(allData);
</script>
