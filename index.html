<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim Staten Island</title>
  
  <meta property="og:title" content="Mekor Chaim Staten Island - Weekly Shiur">
  <meta property="og:description" content="Listen to weekly shiurim by Rabbi Zish Kohn. App available for download.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://office212.github.io/rabbi_zish_kohn/">
  <meta property="og:image" content="icon-512.png">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2166ff">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex,nofollow" />

  <style>
    /* --- CSS Styles --- */
    :root{--w:1080px;--card:#fff;--accent:#2166ff;--border-soft:#e3e6f0;--text-main:#111827;--text-muted:#6b7280;--bg-main:#f3f4f6;--header-gradient:linear-gradient(135deg,#eef2ff 0,#e0f2fe 40%,#fef9c3 100%)}
    body.dark-mode{--card:#1f2937;--border-soft:#374151;--text-main:#f9fafb;--text-muted:#9ca3af;--bg-main:#111827;--header-gradient:linear-gradient(135deg,#1e3a8a 0,#0c4a6e 40%,#854d0e 100%)}
    
    /* Dark mode overrides */
    body.dark-mode .header-inner{box-shadow:0 10px 22px rgba(0,0,0,.6)}
    body.dark-mode .player-card,body.dark-mode .list-card{box-shadow:0 8px 24px rgba(0,0,0,.6)}
    body.dark-mode .player-header,body.dark-mode .list-header{background:#1f2937;border-bottom-color:#374151}
    body.dark-mode .item:hover{background:#374151}
    body.dark-mode .item.active{background:#1e3a8a}
    body.dark-mode .filters input,body.dark-mode .filters select{background:#374151;color:#f9fafb;border-color:#4b5563}
    body.dark-mode .list::-webkit-scrollbar-track{background:#1f2937}
    body.dark-mode .list::-webkit-scrollbar-thumb{background:#4b5563;border-color:#1f2937}
    body.dark-mode .skeleton-wrapper{background:#1f2937}
    body.dark-mode .skel-line{background:#374151;background-image:linear-gradient(to right,#374151 0%,#4b5563 20%,#374151 40%,#374151 100%)}
    body.dark-mode .theme-toggle{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#f9fafb}
    body.dark-mode .control-btn{background:#374151;border-color:#4b5563;color:#f9fafb}
    body.dark-mode .control-btn:hover{background:#4b5563}
    body.dark-mode .control-btn.active{background:var(--accent);color:#fff}
    
    /* Layout & Base */
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg-main);color:var(--text-main);padding-bottom:80px;transition:background .3s,color .3s}
    header,main,footer{max-width:var(--w);margin:0 auto;padding:0 16px}
    header{padding-top:18px;padding-bottom:12px}
    
    /* Header */
    .header-inner{background:var(--header-gradient);border-radius:18px;padding:18px 20px;box-shadow:0 10px 22px rgba(148,163,184,.4);border:1px solid rgba(148,163,184,.5)}
    h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
    .sub{font-size:.95rem;color:#374151;margin-top:4px}
    .header-controls{margin-top:12px;display:flex;gap:8px;align-items:center}
    
    /* Buttons */
    .install-btn{background:#111827;color:#fff;border:none;padding:8px 16px;border-radius:99px;font-weight:600;font-size:.85rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;align-items:center;gap:6px}
    .theme-toggle{background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.1);padding:8px 12px;border-radius:99px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    
    /* iOS Prompt */
    .ios-prompt{background:rgba(255,255,255,.95);border:1px solid #e5e7eb;border-radius:16px;padding:20px;position:fixed;bottom:24px;left:16px;right:16px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(12px);animation:slideUp .6s ease;display:none}
    @keyframes slideUp{from{transform:translateY(120%)}to{transform:translateY(0)}}
    .ios-close{position:absolute;top:12px;right:12px;background:#f3f4f6;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}

    /* Layout Grid */
    .layout{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:flex-start}
    @media(max-width:880px){.layout{grid-template-columns:1fr}}

    /* Cards */
    .player-card,.list-card{background:var(--card);border-radius:18px;border:1px solid var(--border-soft);box-shadow:0 8px 24px rgba(148,163,184,.45);overflow:hidden}
    .player-header{padding:14px 16px 10px;border-bottom:1px solid #e5e7eb}
    .player-title{font-size:1.1rem;font-weight:700;margin:0 0 6px;color:var(--text-main)}
    .player-meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .badge-main{display:inline-flex;padding:2px 8px;border-radius:99px;background:rgba(30,64,175,.08);color:#1d4ed8;font-size:.75rem;font-weight:500;border:1px solid rgba(30,64,175,.2);margin-right:6px}
    
    /* Controls */
    .player-controls{display:flex;gap:6px;margin-top:8px}
    .control-btn{background:#f3f4f6;border:1px solid #d1d5db;padding:6px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
    .control-btn:hover{background:#e5e7eb}
    .control-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    /* Player Frame */
    .frame{position:relative;width:100%;padding-top:56.25%;background:#000}
    .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    
    /* Skeleton Loader */
    .skeleton-wrapper{padding:16px;background:var(--card)}
    .skel-line{height:20px;margin-bottom:10px;border-radius:6px;background:#f1f5f9;background-image:linear-gradient(to right,#f1f5f9 0%,#e2e8f0 20%,#f1f5f9 40%,#f1f5f9 100%);background-size:1000px 100%;animation:shimmer 1.5s infinite linear}
    .skel-video{width:100%;padding-top:56.25%;border-radius:12px;margin-top:10px}
    @keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}

    /* List */
    .list-header{padding:10px 12px;background:#f9fafb;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;align-items:center}
    .filters{display:flex;gap:6px;flex:1}
    .filters input,.filters select{border-radius:99px;border:1px solid #d1d5db;padding:6px 12px;font-size:.85rem;background:var(--card);color:var(--text-main)}
    .list{list-style:none;margin:0;padding:0;max-height:560px;overflow-y:auto}
    .item{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}
    .item:hover{background:#f8fafc}
    .item.active{background:#eff6ff;border-left:3px solid var(--accent)}
    .item-thumb img{width:110px;border-radius:8px;display:block;aspect-ratio:16/9;object-fit:cover}
    .item-body{flex:1;display:flex;flex-direction:column;gap:2px}
    .item-title{font-size:.9rem;font-weight:600}
    .item-date{font-size:.75rem;color:var(--text-muted)}
    
    /* Badges */
    .badge-new{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:99px;background:#fffbeb;border:1px solid #fcd34d;color:#b45309;font-size:.7rem}
    .badge-continue{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:99px;background:#dbeafe;border:1px solid #3b82f6;color:#1e40af;font-size:.7rem}

    /* Back to top */
    #back-to-top{position:fixed;bottom:30px;right:20px;padding:10px 20px;border-radius:50px;background:var(--accent);color:#fff;border:none;box-shadow:0 8px 20px rgba(33,102,255,.35);font-weight:600;display:none;cursor:pointer;z-index:50}
    
    @media(max-width:600px){.item{flex-direction:column}.item-thumb img{width:100%}}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim Staten Island</h1>
    <div class="sub">Weekly Shiurim - Rabbi Zish Kohn</div>
    <div class="header-controls">
      <button id="install-btn" class="install-btn">📲 Install App</button>
      <button id="theme-toggle" class="theme-toggle"><span id="theme-icon">🌙</span> Dark Mode</button>
    </div>
  </div>
</header>

<main>
  <div class="layout">
    <section class="player-card" id="player-card">
      <div id="skeleton" class="skeleton-wrapper">
        <div class="skel-line" style="width:70%"></div>
        <div class="skel-line" style="width:40%;height:16px"></div>
        <div class="skel-line skel-video"></div>
      </div>

      <div id="player-content" style="display:none">
        <div class="player-header">
          <h2 class="player-title" id="player-title">Select a shiur</h2>
          <div class="player-meta-row">
            <div><span class="badge-main">Torah</span><span id="player-date" style="font-size:0.85rem;color:var(--text-muted)"></span></div>
            <button onclick="shareShiur()" style="background:transparent;border:1px solid #ccc;border-radius:20px;padding:2px 10px;font-size:0.8rem;cursor:pointer;color:var(--text-main)">Share</button>
          </div>
          <div class="player-controls">
             </div>
        </div>
        <div class="frame">
          <iframe id="player" src="" allowfullscreen title="Video player" allow="autoplay"></iframe>
        </div>
      </div>
    </section>

    <section class="list-card">
      <div class="list-header">
        <div style="font-weight:600">Shiurim</div>
        <div class="filters">
          <input id="search-input" type="search" placeholder="Search..." aria-label="Search">
          <select id="year-filter"><option value="">Year</option></select>
        </div>
      </div>
      <ul id="shiur-list" class="list"></ul>
    </section>
  </div>
</main>

<footer>&copy; <span id="year-copy"></span> Mekor Chaim Staten Island</footer>
<button id="back-to-top">↑ Top</button>

<div id="ios-install-prompt" class="ios-prompt">
  <span class="ios-close">&times;</span>
  <p style="margin:0 0 5px;font-weight:bold">Install App:</p>
  <div style="font-size:0.9rem">1. Tap Share button below<br>2. Scroll & tap <strong>"Add to Home Screen"</strong></div>
</div>

<script>
  // --- CONFIG ---
  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I";
  const PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";

  // --- DOM ELEMENTS ---
  const listEl = document.getElementById("shiur-list");
  const searchInput = document.getElementById("search-input");
  const yearFilter = document.getElementById("year-filter");
  const backToTopBtn = document.getElementById("back-to-top");
  
  // --- STATE ---
  let allData = [];
  let currentId = null;

  document.getElementById("year-copy").textContent = new Date().getFullYear();

  // --- SERVICE WORKER (PWA) ---
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('SW Registered'))
      .catch((e) => console.log('SW Failed', e));
  }

  // --- INIT ---
  initApp();

  async function initApp() {
    await loadData();
    
    // Check URL param or Last Watched
    const urlParams = new URLSearchParams(window.location.search);
    const urlVideo = urlParams.get('v');
    const lastWatched = localStorage.getItem('lastWatched');

    if (allData.length > 0) {
      if (urlVideo && allData.find(d => d.id === urlVideo)) {
        playVideo(urlVideo, false);
      } else if (lastWatched && allData.find(d => d.id === lastWatched)) {
        playVideo(lastWatched, false);
      } else {
        // Show first video meta but don't autoplay
        const first = allData[0];
        updatePlayerMeta(first.title, first.dateNice);
        document.getElementById("player").src = `https://www.youtube-nocookie.com/embed/${first.id}?rel=0&modestbranding=1&playsinline=1`;
        currentId = first.id;
        renderList(allData); // re-render to highlight
      }
    }
  }

  // --- DATA LOADING ---
  async function loadData() {
    try {
      const items = await fetchAllItems();
      processData(items);
      // Switch from Skeleton to Content
      document.getElementById("skeleton").style.display = "none";
      document.getElementById("player-content").style.display = "block";
    } catch(err) {
      console.error(err);
      document.getElementById("player-title").textContent = "Error loading. Please refresh.";
    }
  }

  async function fetchAllItems(token = "", acc = []) {
    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}&pageToken=${token}`;
    const res = await fetch(url);
    const data = await res.json();
    acc.push(...data.items);
    if (data.nextPageToken) return fetchAllItems(data.nextPageToken, acc);
    return acc;
  }

  function processData(items) {
    // Sort newest first
    items.sort((a,b) => new Date(b.contentDetails.videoPublishedAt) - new Date(a.contentDetails.videoPublishedAt));
    
    const lastWatched = localStorage.getItem('lastWatched');

    allData = items.map((item, idx) => {
      const d = new Date(item.contentDetails.videoPublishedAt || item.snippet.publishedAt);
      const vidId = item.contentDetails.videoId;
      return {
        id: vidId,
        title: item.snippet.title,
        dateNice: d.toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"}),
        year: d.getFullYear().toString(),
        desc: item.snippet.description || "",
        isNew: idx === 0,
        isContinue: (vidId === lastWatched)
      };
    });

    // Populate Year Filter
    const years = [...new Set(allData.map(d => d.year))];
    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      yearFilter.appendChild(opt);
    });

    renderList(allData);
  }

  // --- RENDERING ---
  function renderList(items) {
    listEl.innerHTML = "";
    items.forEach(item => {
      const li = document.createElement("li");
      li.className = "item";
      if (item.id === currentId) li.classList.add("active");
      
      let badgeHTML = "";
      if (item.isNew) badgeHTML += `<span class="badge-new">New</span>`;
      if (item.isContinue && item.id !== currentId) badgeHTML += `<span class="badge-continue">Resume</span>`;

      li.innerHTML = `
        <div class="item-thumb">
          <img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg" loading="lazy" alt="thumb">
        </div>
        <div class="item-body">
          <div class="item-title">${item.title}</div>
          <div class="item-date">${badgeHTML} ${item.dateNice}</div>
        </div>
      `;
      li.addEventListener("click", () => playVideo(item.id, true));
      listEl.appendChild(li);
    });
  }

  // --- PLAYER LOGIC ---
  function playVideo(id, autoScroll) {
    currentId = id;
    const item = allData.find(d => d.id === id);
    if(!item) return;

    // Save Last Watched
    localStorage.setItem('lastWatched', id);
    
    // Update URL without reload
    const newUrl = new URL(window.location);
    newUrl.searchParams.set('v', id);
    window.history.pushState({}, '', newUrl);

    updatePlayerMeta(item.title, item.dateNice);
    document.getElementById("player").src = `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1&autoplay=1`;

    // Re-render list to show active state
    renderList(allData.filter(filterLogic)); 

    if(autoScroll) {
      const playerCard = document.getElementById("player-card");
      if (playerCard) {
        playerCard.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  }

  function updatePlayerMeta(title, date) {
    document.getElementById("player-title").textContent = title;
    document.getElementById("player-date").textContent = date;
  }

  function shareShiur() {
    if (navigator.share) {
      navigator.share({
        title: 'Mekor Chaim Shiur',
        url: window.location.href
      });
    } else {
      alert("Link copied: " + window.location.href);
      navigator.clipboard.writeText(window.location.href);
    }
  }

  // --- FILTERS ---
  function filterLogic(item) {
    const q = searchInput.value.toLowerCase();
    const y = yearFilter.value;
    const matchesSearch = item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
    const matchesYear = !y || item.year === y;
    return matchesSearch && matchesYear;
  }

  function applyFilters() {
    const filtered = allData.filter(filterLogic);
    renderList(filtered);
  }

  searchInput.addEventListener("input", applyFilters);
  yearFilter.addEventListener("change", applyFilters);

  // --- THEME TOGGLE ---
  const themeToggle = document.getElementById("theme-toggle");
  const savedTheme = localStorage.getItem("theme");
  if(savedTheme === 'dark') document.body.classList.add('dark-mode');
  
  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });

  // --- INSTALL PROMPT (PWA) ---
  let deferredPrompt;
  const installBtn = document.getElementById("install-btn");
  
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-flex';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  // iOS Detection
  const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);
  if (isIos && !isInStandaloneMode) {
    const iosPrompt = document.getElementById("ios-install-prompt");
    // Show after 3 seconds
    setTimeout(() => iosPrompt.style.display = "block", 3000);
    document.querySelector(".ios-close").addEventListener("click", () => iosPrompt.style.display="none");
  }

  // Back to top
  window.addEventListener("scroll", () => {
    if(window.scrollY > 300) backToTopBtn.style.display = "block";
    else backToTopBtn.style.display = "none";
  });
  backToTopBtn.addEventListener("click", () => window.scrollTo({top:0, behavior:'smooth'}));

</script>
</body>
</html>
