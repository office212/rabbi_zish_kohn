<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim SI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc; --card-bg: #ffffff; --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.1);
      --text-main: #0f172a; --text-muted: #64748b; --border-soft: #e2e8f0;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --fav-color: #ef4444; --watched-color: #10b981; --gold: #f59e0b;
    }
    body.dark-mode {
      --bg-main: #020617; --card-bg: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
      --border-soft: #1e293b; --accent: #60a5fa; --header-bg: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); padding-bottom: 100px; text-align: left; transition: background 0.3s; }

    header, main, footer { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 16px; }

    /* MOBILE FULL WIDTH FIX */
    @media (max-width: 600px) {
      header, main { padding: 0; }
      .header-inner { border-radius: 0 0 24px 24px; }
      .player-card { border-radius: 0; border-left: none; border-right: none; margin-bottom: 16px; }
      .list-header { padding: 0 16px; }
      #shiur-list { padding: 0 16px; }
    }

    header { padding: 20px 16px; }
    .header-inner { background: var(--header-bg); border-radius: 24px; padding: 24px; color: white; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2); }
    .header-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
    .nav-btn { border-radius: 99px; font-size: 0.75rem; font-weight: 600; padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; transition: 0.2s; }
    .stats-btn { background: white; color: var(--accent); }
    .resume-btn { background: #10b981; color: white; }
    .autoplay-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); }
    .autoplay-btn.active { background: #10b981; border-color: #10b981; }

    .player-card { background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); overflow: hidden; margin-bottom: 24px; position: relative; padding: 0 !important; }
    .player-header { padding: 20px; border-bottom: 1px solid var(--border-soft); }
    .player-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; line-height: 1.4; }
    .badge-main { background: var(--accent-glow); color: var(--accent); padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border-soft); }

    .video-container { width: 100%; position: relative; padding-top: 56.25%; background: #000; margin: 0; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .speed-btns { display: flex; gap: 8px; padding: 15px 20px; background: var(--bg-main); overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border-soft); }
    .speed-btn { background: var(--card-bg); color: var(--text-muted); padding: 10px 18px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border-soft); cursor: pointer; }
    .speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .notes-section { padding: 20px; background: var(--bg-main); }
    .notes-actions { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .tool-btn { padding: 10px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); cursor: pointer; border: none; display: flex; align-items: center; gap: 5px; }
    .tool-btn.primary { background: var(--accent); color: white; }
    .tool-btn.time { background: #fef3c7; color: #d97706; }
    .tool-btn.done { background: #dcfce7; color: #166534; }

    .notes-input, .notes-display { width: 100%; min-height: 120px; padding: 16px; border-radius: 16px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.95rem; background: var(--card-bg); line-height: 1.6; }
    .notes-display { display: none; white-space: pre-wrap; text-align: left; }
    .ts-link { color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; background: var(--accent-glow); padding: 2px 4px; border-radius: 4px; }

    .list-header { margin-bottom: 24px; display: flex; gap: 12px; align-items: center; width: 100%; }
    .search-wrapper { position: relative; flex: 1; }
    #search-input { width: 100%; padding: 15px 20px 15px 48px; border-radius: 99px; border: 1px solid var(--border-soft); background: var(--card-bg); outline: none; box-shadow: var(--shadow-card); }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }
    .fav-filter-btn { padding: 12px 24px; border-radius: 99px; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); font-weight: 700; cursor: pointer; }
    .fav-filter-btn.active { background: #fee2e2; color: #ef4444; border-color: #fecaca; }

    .item { display: flex; gap: 16px; padding: 12px; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-soft); margin-bottom: 16px; align-items: center; cursor: pointer; position: relative; box-shadow: var(--shadow-card); }
    .item.active { border-color: var(--accent); background: var(--accent-glow); }
    .item-thumb { flex: 0 0 110px; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; background: #eee; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .btn-fav-overlay { position: absolute; bottom: 6px; right: 6px; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 5; }
    .btn-fav-overlay svg { width: 16px; height: 16px; fill: #cbd5e1; }
    .btn-fav-overlay.active svg { fill: var(--fav-color); }
    .completed-icon { position: absolute; top: 4px; left: 4px; background: var(--watched-color); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; z-index: 5; }
    .item-progress-fill { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--watched-color); width: 0%; transition: width 0.3s; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; }
    .overlay.active { display: flex !important; }
    .modal { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 30px; padding: 28px; position: relative; text-align: center; border: 1px solid var(--border-soft); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }

    .share-dropdown { position: absolute; top: 110%; right: 0; background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; flex-direction: column; min-width: 190px; z-index: 1000; overflow: hidden; }
    .share-dropdown.active { display: flex; }
    .share-option { background: none; border: none; padding: 14px 18px; text-align: left; font-size: 0.85rem; font-weight: 600; color: var(--text-main); border-bottom: 1px solid var(--border-soft); cursor: pointer; }

    .empty-state { width: 100%; padding: 50px 20px; text-align: center; border: 2px dashed #cbd5e1; border-radius: 28px; background: var(--card-bg); margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .empty-state-icon { color: var(--fav-color); font-size: 3rem; }
    .empty-state-text { font-weight: 600; color: var(--text-muted); line-height: 1.5; }

    #install-banner { position: fixed; bottom: 80px; left: 20px; right: 20px; background: var(--accent); color: white; padding: 16px; border-radius: 16px; display: none; justify-content: space-between; align-items: center; z-index: 9999; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; opacity: 0; transition: 0.4s; z-index: 10001; pointer-events: none; }
    .toast.show { opacity: 1; }

    footer { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 50px; padding: 20px 0 60px; }
  </style>
</head>
<body>

<div id="install-banner">
  <div>
    <div style="font-weight:700;">📱 Install App</div>
    <div style="font-size:0.85rem; opacity:0.9;">For the best experience!</div>
  </div>
  <button onclick="installApp()" style="background:white; color:var(--accent); padding:10px 20px; border-radius:99px; border:none; font-weight:700; cursor:pointer;">Install</button>
</div>

<div id="stats-overlay" class="overlay">
  <div class="modal">
    <button onclick="closeOverlay('stats-overlay')" style="position:absolute; top:15px; right:15px; background:none; border:none; font-size:1.5rem; cursor:pointer;">✕</button>
    <h3 style="margin-top:0;">My Torah Stats 📊</h3>
    <div style="display:flex; justify-content:space-around; text-align:center; margin-top:20px;">
      <div><span id="stat-streak" style="font-size:1.8rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Streak</span></div>
      <div><span id="stat-hours" style="font-size:1.8rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Hours</span></div>
      <div><span id="stat-completed" style="font-size:1.8rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Completed</span></div>
    </div>
  </div>
</div>

<div id="quote-overlay" class="overlay">
  <div class="modal">
    <button onclick="closeOverlay('quote-overlay')" style="position:absolute; top:15px; right:15px; background:none; border:none; font-size:1.5rem; cursor:pointer;">✕</button>
    <h3 style="margin:0;">Share a Quote 🎨</h3>
    <textarea id="quote-text" dir="auto" style="width:100%; height:120px; margin-top:15px; border-radius:12px; padding:12px; border:1px solid var(--border-soft); font-family:inherit; resize:none;" placeholder="Type a quote..."></textarea>
    <button onclick="generateAndShareQuote()" style="width:100%; background:var(--accent); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; margin-top:15px; cursor:pointer;">Create Royal Image</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim SI</h1>
    <div class="sub">Weekly Shiurim - Rabbi Zish Kohn</div>
    <div class="header-controls">
      <button onclick="openStats()" class="nav-btn stats-btn">📊 Stats</button>
      <button onclick="resumeLast()" class="nav-btn resume-btn">▶️ Resume</button>
      <button id="autoplay-toggle" onclick="toggleAutoPlay()" class="nav-btn autoplay-btn">⏭️ Auto Play: OFF</button>
      <button onclick="toggleTheme()" class="nav-btn theme-toggle" id="theme-btn" style="background:rgba(255,255,255,0.2); color:white;">🌙 Dark Mode</button>
    </div>
  </div>
</header>

<main>
  <div class="player-card" id="player-card">
    <div id="skeleton" style="height:200px; background:#eee; border-radius:24px; margin:20px;"></div>
    <div id="player-content" style="display:none">
      <div class="player-header">
        <h2 class="player-title" id="player-title">Loading...</h2>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div><span class="badge-main">Torah</span> <span id="player-date" style="font-size:0.8rem; color:var(--text-muted); margin-left:8px;"></span></div>
          <div style="position:relative;">
            <button onclick="toggleShareMenu(event)" style="background:#eff6ff; color:#2563eb; padding:8px 20px; border-radius:99px; border:none; font-weight:700; cursor:pointer;">Share</button>
            <div id="share-dropdown" class="share-dropdown">
              <button class="share-option" onclick="shareLink(false)">🔗 Copy App Link</button>
              <button class="share-option" onclick="shareLink(true)">⏱️ Link at Current Time</button>
              <button class="share-option" onclick="shareToWhatsApp()">💬 Share to WhatsApp</button>
            </div>
          </div>
        </div>
      </div>
      <div class="video-container"><div id="player-placeholder"></div></div>
      <div class="speed-btns">
          <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
          <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25x</button>
          <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5x</button>
          <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
      </div>
      <div class="notes-section">
        <div class="notes-actions">
          <button onclick="toggleNoteMode()" id="note-mode-btn" class="tool-btn primary">👁️ View</button>
          <button onclick="insertTimestamp()" class="tool-btn time">⏱️ Time</button>
          <button onclick="openQuoteCreator()" class="tool-btn" style="background:#fef3c7; color:#d97706;">🎨 Quote</button>
          <button id="btn-mark-done" onclick="toggleManualComplete()" class="tool-btn done">☐ Mark Done</button>
          <button onclick="exportNotes()" class="tool-btn">💾 Export</button>
        </div>
        <textarea id="notes-input" dir="auto" class="notes-input" placeholder="Notes autosave..."></textarea>
        <div id="notes-display" dir="auto" class="notes-display"></div>
      </div>
    </div>
  </div>

  <div class="list-header">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="search" placeholder="Search topics or dates..." oninput="renderList()">
    </div>
    <button id="fav-filter-btn" class="fav-filter-btn" onclick="toggleFavFilter()">Saved ❤️</button>
  </div>
  <ul id="shiur-list" class="list"></ul>
</main>

<div id="toast" class="toast"></div>

<script>
  // 1. YouTube API Robust Loading
  (function loadYouTubeAPI() {
    if (window.YT && window.YT.Player) { onYouTubeIframeAPIReady(); return; }
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  })();

  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I", PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";
  let deferredPrompt;

  const appState = {
    allData: JSON.parse(localStorage.getItem('mc_all_data') || '[]'),
    currentId: null, playerReady: false, 
    autoPlay: localStorage.getItem('mc_autoplay') === 'true',
    favorites: new Set(JSON.parse(localStorage.getItem('mc_favorites') || '[]')),
    progress: JSON.parse(localStorage.getItem('mc_progress') || '{}'),
    notes: JSON.parse(localStorage.getItem('mc_notes') || '{}'),
    durations: JSON.parse(localStorage.getItem('mc_durations') || '{}'),
    stats: JSON.parse(localStorage.getItem('mc_stats') || '{"totalSeconds":0, "streak":0, "lastVisit":"", "dailySeconds":0}'),
    completed: new Set(JSON.parse(localStorage.getItem('mc_completed') || '[]')),
    save() {
      localStorage.setItem('mc_favorites', JSON.stringify([...this.favorites]));
      localStorage.setItem('mc_progress', JSON.stringify(this.progress));
      localStorage.setItem('mc_notes', JSON.stringify(this.notes));
      localStorage.setItem('mc_durations', JSON.stringify(this.durations));
      localStorage.setItem('mc_stats', JSON.stringify(this.stats));
      localStorage.setItem('mc_completed', JSON.stringify([...this.completed]));
      localStorage.setItem('mc_autoplay', this.autoPlay);
      localStorage.setItem('mc_all_data', JSON.stringify(this.allData));
    }
  };

  let player = null, progressInterval = null;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player-placeholder', {
      height: '100%', width: '100%', videoId: '',
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1, 'origin': window.location.origin },
      events: { 'onReady': () => { appState.playerReady = true; startWatchdog(); }, 'onStateChange': onPlayerStateChange }
    });
    initApp();
  }

  function initApp() {
    if(appState.allData.length > 0) { renderList(); showUI(); }
    fetchAllData(); updateAutoPlayUI(); applySavedTheme();
    window.addEventListener('beforeunload', () => { updateStreak(); appState.save(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    setTimeout(() => { document.getElementById('install-banner').style.display = 'flex'; }, 4000);
  });

  async function installApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
    if (outcome === 'accepted') showToast('✅ Installed!');
  }

  /* START WATCHDOG - INTEGRATED URL PARAMS (Priority Logic) */
  function startWatchdog() {
    const watchdog = setInterval(() => {
      if (appState.playerReady && appState.allData.length > 0) {
        const title = document.getElementById("player-title").textContent;
        // Check if video is not yet loaded
        if (title === "Loading..." || title === "Select a shiur") {
          const params = new URLSearchParams(window.location.search);
          const v = params.get('v');
          const t = params.get('t');
          const last = localStorage.getItem('lastWatched');

          // 1. Priority: URL Parameters (?v= and ?t=)
          if (v && appState.allData.some(d => d.id === v)) {
            playVideo(v, false, t ? parseInt(t) : null);
          } 
          // 2. Priority: Last Watched from Local Storage
          else if (last && appState.allData.some(d => d.id === last)) {
            playVideo(last, false);
          } 
          // 3. Fallback: Newest lesson
          else {
            playVideo(appState.allData[0].id, false);
          }
        } else { 
          // Video loaded, stop monitoring
          clearInterval(watchdog); 
        }
      }
    }, 1000);
    setTimeout(() => clearInterval(watchdog), 15000);
  }

  function showUI() { document.getElementById("skeleton").style.display = "none"; document.getElementById("player-content").style.display = "block"; }

  async function fetchAllData(token = "", acc = []) {
    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}&pageToken=${token}&_t=${Date.now()}`);
      const data = await res.json();
      if (!data.items) throw new Error();
      acc.push(...data.items);
      if (data.nextPageToken) return fetchAllData(data.nextPageToken, acc);
      const newData = acc.map(i => ({ id: i.contentDetails.videoId, title: i.snippet.title, pubDate: i.contentDetails.videoPublishedAt, dateNice: new Date(i.contentDetails.videoPublishedAt).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"}) })).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      if(JSON.stringify(newData) !== JSON.stringify(appState.allData)) { appState.allData = newData; appState.save(); renderList(); showUI(); }
    } catch(e) { showUI(); }
  }

  function playVideo(id, autoScroll, time = null) {
    if(!appState.playerReady) return;
    appState.currentId = id; localStorage.setItem('lastWatched', id);
    const item = appState.allData.find(d => d.id === id);
    if(!item) return;
    localStorage.setItem('mc_viewed_' + id, 'true');
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    document.getElementById("notes-input").value = appState.notes[id] || "";
    updateNotesDisplay(appState.notes[id] || "");
    updateManualBtnUI();
    let start = (time !== null) ? parseInt(time) : (appState.progress[id] || 0);
    player.loadVideoById({ videoId: id, startSeconds: start });
    renderList(); if(autoScroll) window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      if (progressInterval) clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        const t = Math.floor(player.getCurrentTime()), dur = player.getDuration();
        appState.progress[appState.currentId] = t;
        appState.stats.totalSeconds += 1; appState.stats.dailySeconds += 1;
        if(dur > 0) {
          appState.durations[appState.currentId] = dur;
          if (t > dur * 0.9 && !appState.completed.has(appState.currentId)) {
            appState.completed.add(appState.currentId); confetti();
            renderList(); updateManualBtnUI();
          }
          if (t >= dur - 2 && appState.autoPlay) {
             const idx = appState.allData.findIndex(d => d.id === appState.currentId);
             if (idx < appState.allData.length - 1) playVideo(appState.allData[idx + 1].id, false);
          }
        }
        updateLiveProgressBar(t, dur);
      }, 1000);
    } else { clearInterval(progressInterval); }
  }

  function renderList() {
    const list = document.getElementById("shiur-list"), filter = document.getElementById("search-input").value.toLowerCase();
    list.innerHTML = "";
    const filtered = appState.allData.filter(i => (i.title.toLowerCase().includes(filter) || i.dateNice.toLowerCase().includes(filter)) && (!appState.showFavoritesOnly || appState.favorites.has(i.id)));

    if (appState.showFavoritesOnly && filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="empty-state-icon">❤️</span>
          <div class="empty-state-text">No saved lessons.</div>
        </div>`;
      return;
    }
    filtered.forEach((item) => {
      const prog = appState.progress[item.id] || 0, dur = appState.durations[item.id] || 0, isComp = appState.completed.has(item.id), isViewed = localStorage.getItem('mc_viewed_'+item.id);
      let percent = isComp ? 100 : (dur > 0 ? (prog/dur)*100 : 0);
      const isNew = item.pubDate === localStorage.getItem('mc_latest') && !isViewed;
      const li = document.createElement("li"); li.className = `item ${item.id === appState.currentId ? 'active' : ''}`;
      li.dataset.id = item.id;
      li.innerHTML = `<div class="item-thumb"><img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg"> ${isComp ? '<div class="completed-icon">✔</div>' : ''} <button class="btn-fav-overlay ${appState.favorites.has(item.id)?'active':''}" onclick="event.stopPropagation(); toggleFav('${item.id}')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button> <div class="item-progress-fill" style="width:${percent}%"></div> </div> <div class="item-body"><div class="item-title">${item.title}${isNew ? '<span class="new-badge">NEW</span>' : ''}</div><div class="item-date">${item.dateNice}${dur ? ' • '+Math.round(dur/60)+' min' : ''}</div></div>`;
      li.onclick = () => playVideo(item.id, true); list.appendChild(li);
    });
  }

  function generateAndShareQuote() {
    const text = document.getElementById('quote-text').value; if(!text.trim()) return;
    const canvas = document.createElement('canvas'); canvas.width = 1080; canvas.height = 1080; const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,1080,1080); grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(1, '#1e40af'); ctx.fillStyle = grad; ctx.fillRect(0,0,1080,1080);
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 35; ctx.strokeRect(45,45,990,990);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 70px "Frank Ruhl Libre", serif'; ctx.textAlign = 'center'; wrapText(ctx, `"${text}"`, 540, 480, 900, 95);
    ctx.fillStyle = '#93c5fd'; ctx.font = '50px Inter'; ctx.fillText("Rabbi Zish Kohn", 540, 880);
    ctx.font = '32px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText("Mekor Chaim Staten Island", 540, 940);
    canvas.toBlob(b => { const f = new File([b], "quote.png", {type: "image/png"}); if(navigator.share) navigator.share({files:[f]}).catch(console.error); });
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) { const words = text.split(' '); let line = ''; for(let n = 0; n < words.length; n++) { let testLine = line + words[n] + ' '; if (ctx.measureText(testLine).width > maxWidth) { ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight; } else line = testLine; } ctx.fillText(line, x, y); }
  function toggleTheme() { const isDark = document.body.classList.toggle("dark-mode"); updateThemeUI(isDark); }
  function updateThemeUI(isDark) { const btn = document.getElementById('theme-btn'); if(btn) btn.innerHTML = isDark ? "☀️ Light Mode" : "🌙 Dark Mode"; localStorage.setItem('theme', isDark ? 'dark' : 'light'); }
  function applySavedTheme() { if(localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); updateThemeUI(true); } }
  function toggleFav(id) { appState.favorites.has(id) ? appState.favorites.delete(id) : appState.favorites.add(id); appState.save(); renderList(); }
  function toggleFavFilter() { appState.showFavoritesOnly = !appState.showFavoritesOnly; document.getElementById("fav-filter-btn").classList.toggle('active'); renderList(); }
  function setSpeed(s, btn) { if(player && player.setPlaybackRate) { player.setPlaybackRate(s); document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); } }
  function insertTimestamp() { if(!player || !player.getCurrentTime) return; const t = Math.floor(player.getCurrentTime()), ts = `[${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}] `; document.getElementById("notes-input").value += ts; appState.save(); }
  function toggleNoteMode() { appState.isNoteEditMode = !appState.isNoteEditMode; const input = document.getElementById("notes-input"), display = document.getElementById("notes-display"), btn = document.getElementById("note-mode-btn"); if(appState.isNoteEditMode) { input.style.display = "block"; display.style.display = "none"; btn.innerHTML = "👁️ View"; } else { updateNotesDisplay(input.value); input.style.display = "none"; display.style.display = "block"; btn.innerHTML = "✏️ Edit"; } }
  function updateNotesDisplay(text) { const html = text.replace(/\[(\d+):(\d+)\]/g, (match, m, s) => `<span class="ts-link" onclick="player.seekTo(${parseInt(m)*60+parseInt(s)}, true)">${match}</span>`); document.getElementById("notes-display").innerHTML = html || "No notes yet."; }
  function exportNotes() { const text = document.getElementById("notes-input").value; if(!text) { showToast("No notes to export"); return; } const blob = new Blob([text], {type: "text/plain"}), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "shiur_notes.txt"; a.click(); }
  function resumeLast() { const last = localStorage.getItem('lastWatched'); if (last && appState.allData.some(d => d.id === last)) { playVideo(last, true); showToast("Resuming..."); } }
  function toggleAutoPlay() { appState.autoPlay = !appState.autoPlay; appState.save(); updateAutoPlayUI(); }
  function updateAutoPlayUI() { const btn = document.getElementById('autoplay-toggle'); if(btn) { btn.textContent = appState.autoPlay ? "⏭️ Auto Play: ON" : "⏭️ Auto Play: OFF"; btn.classList.toggle('active', appState.autoPlay); } }
  function toggleManualComplete() { if(appState.currentId) { if(appState.completed.has(appState.currentId)) appState.completed.delete(appState.currentId); else { appState.completed.add(appState.currentId); confetti(); } appState.save(); renderList(); updateManualBtnUI(); } }
  function updateManualBtnUI() { const btn = document.getElementById('btn-mark-done'); if(btn) { btn.innerHTML = appState.completed.has(appState.currentId) ? "✅ Completed" : "☐ Mark Done"; } }
  function openStats() { const s = appState.stats; document.getElementById('stat-streak').textContent = s.streak; document.getElementById('stat-hours').textContent = (s.totalSeconds/3600).toFixed(1); document.getElementById('stat-completed').textContent = appState.completed.size; document.getElementById('stats-overlay').classList.add('active'); }
  function closeOverlay(id) { document.getElementById(id).classList.remove('active'); }
  function showToast(m) { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3000); }
  function toggleDrivingMode() { document.getElementById("driving-mode").classList.toggle('active'); }
  function togglePlay() { player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
  function seek(s) { player.seekTo(player.getCurrentTime() + s, true); }
  function openQuoteCreator() { document.getElementById('quote-overlay').classList.add('active'); }
  function toggleShareMenu(e) { e.stopPropagation(); document.getElementById("share-dropdown").classList.toggle("active"); }
  window.onclick = () => { document.getElementById("share-dropdown").classList.remove("active"); };
  function shareLink(withTime) { if (!appState.currentId) return; let url = window.location.origin + window.location.pathname + '?v=' + appState.currentId; if(withTime) url += '&t=' + Math.floor(player.getCurrentTime()); if(navigator.share) navigator.share({title: 'Weekly Shiur', url: url}); else { navigator.clipboard.writeText(url); showToast("Link Copied!"); } }
  function shareToWhatsApp() { if (!appState.currentId) return; const item = appState.allData.find(d => d.id === appState.currentId); const text = `🎓 ${item.title}\n\n${window.location.origin}?v=${appState.currentId}`; window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank'); }
  function updateLiveProgressBar(t, dur) { const bar = document.querySelector(`.item[data-id="${appState.currentId}"] .item-progress-fill`); if(bar && dur > 0) bar.style.width = (t/dur)*100 + '%'; }
  function updateStreak() { const today = new Date().toISOString().split('T')[0]; if (appState.stats.lastVisit !== today) { if (appState.stats.dailySeconds >= 120) { const yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0]; appState.stats.streak = (appState.stats.lastVisit === yesterday) ? appState.stats.streak + 1 : 1; } appState.stats.dailySeconds = 0; appState.stats.lastVisit = today; appState.save(); } }
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
