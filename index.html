<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim Staten Island</title>
  
  <meta property="og:title" content="Mekor Chaim Staten Island - Weekly Shiur">
  <meta property="og:description" content="Listen to weekly shiurim by Rabbi Zish Kohn.">
  <meta property="og:image" content="https://office212.github.io/rabbi_zish_kohn/icon-512(1).png">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- VARIABLES --- */
    :root {
      --w: 1000px;
      --bg-main: #f8fafc; --card-bg: #ffffff; --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.15);
      --text-main: #0f172a; --text-muted: #64748b; --border-soft: #e2e8f0;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --fav-color: #ef4444; --watched-color: #10b981;
    }
    body.dark-mode {
      --bg-main: #020617; --card-bg: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
      --border-soft: #1e293b; --accent: #60a5fa; --accent-glow: rgba(96, 165, 250, 0.2);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3); --header-bg: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main);
      padding-bottom: 80px; transition: background 0.3s ease, color 0.3s ease; -webkit-tap-highlight-color: transparent;
    }

    header, main, footer { max-width: var(--w); margin: 0 auto; padding: 0 16px; }
    header { padding-top: 20px; padding-bottom: 24px; }
    .layout { margin-top: 10px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: flex-start; }
    @media(max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    /* HEADER */
    .header-inner { background: var(--header-bg); border-radius: 24px; padding: 24px 28px; color: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .sub { font-size: 0.9rem; opacity: 0.9; margin-top: 4px; }
    .header-controls { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* BUTTONS STYLE */
    button { font-family: inherit; cursor: pointer; border: none; }
    .nav-btn { border-radius: 99px; font-size: 0.8rem; font-weight: 600; padding: 8px 16px; display: inline-flex; align-items: center; gap: 6px; }
    .theme-toggle { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
    .stats-btn { background: white; color: var(--accent); }
    .drive-mode-btn { background: rgba(0,0,0,0.2); color: white; }

    /* PLAYER CARD */
    .player-card { background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); overflow: hidden; position: relative; }
    .player-header { padding: 20px; border-bottom: 1px solid var(--border-soft); }
    .player-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 10px; line-height: 1.3; }
    .player-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    
    .speed-controls { display: flex; gap: 6px; }
    .speed-btn { background: var(--bg-main); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border-soft); transition: 0.2s; }
    .speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .frame { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

    /* NOTES SECTION */
    .notes-section { padding: 20px; background: var(--bg-main); border-top: 1px solid var(--border-soft); }
    .notes-header { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .notes-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    
    .note-tool { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 4px; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-muted); }
    .note-tool.primary { background: var(--accent); color: white; border-color: var(--accent); }
    
    .notes-input { width: 100%; min-height: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.9rem; margin-top: 10px; display: block; }
    .notes-display { width: 100%; min-height: 100px; padding: 12px; background: var(--bg-main); border-radius: 12px; font-size: 0.9rem; line-height: 1.6; display: none; white-space: pre-wrap; }
    .ts-link { color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0 2px; }

    /* LIST */
    .list-header { margin: 20px 0 15px; display: flex; gap: 10px; }
    #search-input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-main); outline: none; }
    .fav-filter { padding: 0 16px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border-soft); font-weight: 600; color: var(--text-muted); }
    .fav-filter.active { color: var(--fav-color); border-color: var(--fav-color); background: #fff1f2; }

    .item { display: flex; gap: 15px; padding: 12px; background: var(--card-bg); border-radius: 18px; border: 1px solid var(--border-soft); margin-bottom: 12px; transition: 0.2s; }
    .item.active { border-color: var(--accent); background: var(--accent-glow); }
    .item-thumb { flex: 0 0 120px; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--watched-color); transition: 0.3s; }
    .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .item-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-date { font-size: 0.8rem; color: var(--text-muted); }

    /* OVERLAYS */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .overlay.active { display: flex; }
    .modal { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 24px; position: relative; }
    
    #driving-mode { background: #000; flex-direction: column; }
    .dm-controls { display: flex; gap: 30px; align-items: center; margin: 40px 0; }
    .dm-btn { width: 80px; height: 80px; border-radius: 50%; background: #222; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .dm-btn.play { width: 100px; height: 100px; background: var(--accent); }
    .dm-close { position: absolute; top: 30px; right: 30px; color: white; background: #333; padding: 10px 20px; border-radius: 99px; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; transition: 0.4s; z-index: 20000; opacity: 0; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div id="driving-mode" class="overlay">
  <button class="dm-close" onclick="toggleDrivingMode()">Exit</button>
  <div style="color: #94a3b8; margin-bottom: 20px;" id="dm-title">No Shiur Playing</div>
  <div class="dm-controls">
    <button class="dm-btn" onclick="seek(-30)"><svg width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span>-30s</span></button>
    <button class="dm-btn play" onclick="togglePlay()"><svg id="dm-play-icon" width="40" height="40" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="dm-btn" onclick="seek(30)"><svg width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg><span>+30s</span></button>
  </div>
</div>

<div id="stats-overlay" class="overlay">
  <div class="modal">
    <button style="position:absolute; top:15px; right:15px;" onclick="closeOverlay('stats-overlay')">✕</button>
    <h3 style="text-align:center; margin-top:0;">My Torah Stats 📊</h3>
    <div style="display:flex; justify-content:space-around; text-align:center; margin-top:20px;">
      <div><span id="stat-streak" style="font-size:1.5rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Streak</span></div>
      <div><span id="stat-hours" style="font-size:1.5rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Hours</span></div>
      <div><span id="stat-completed" style="font-size:1.5rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Watched</span></div>
    </div>
  </div>
</div>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim Staten Island</h1>
    <div class="sub">Weekly Shiurim - Rabbi Zish Kohn</div>
    <div class="header-controls">
      <button onclick="openStats()" class="nav-btn stats-btn">📊 Stats</button>
      <button onclick="toggleDrivingMode()" class="nav-btn drive-mode-btn">🚗 Audio Mode</button>
      <button id="theme-toggle" class="nav-btn theme-toggle">🌙 Mode</button>
    </div>
  </div>
</header>

<main>
  <div class="layout">
    <section class="player-card" id="player-card">
      <div id="skeleton" class="skeleton-wrapper"><div class="skel-video"></div></div>
      <div id="player-content" style="display:none">
        <div class="player-header">
          <h2 class="player-title" id="player-title">Select a shiur</h2>
          <div class="player-meta-row">
            <span id="player-date" style="font-size:0.85rem; color:var(--text-muted);"></span>
            <div class="speed-controls">
              <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
              <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25x</button>
              <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5x</button>
              <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
            </div>
          </div>
        </div>
        <div class="frame"><div id="player-placeholder"></div></div>
        <div class="notes-section">
          <div class="notes-header">
            <span>My Notes 📝</span>
            <div class="notes-actions">
              <button onclick="toggleNoteMode()" id="note-mode-btn" class="note-tool primary">👁️ View</button>
              <button onclick="insertTimestamp()" id="time-btn" class="note-tool">⏱️ Time</button>
              <button onclick="openQuoteCreator()" class="note-tool">🎨 Quote</button>
              <button onclick="exportNotes()" class="note-tool">💾 Export</button>
            </div>
          </div>
          <textarea id="notes-input" class="notes-input" placeholder="Type notes... Use 'Time' to bookmark."></textarea>
          <div id="notes-display" class="notes-display"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="list-header">
        <input id="search-input" type="search" placeholder="Search topics...">
        <button id="fav-btn" class="fav-filter" onclick="toggleFavFilter()">Saved</button>
      </div>
      <ul id="shiur-list" class="list"></ul>
    </section>
  </div>
</main>

<footer>&copy; 2026 Mekor Chaim Staten Island • <a href="mailto:ccdesign.nys@gmail.com">CC Design</a></footer>
<button id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑ Top</button>
<div id="toast" class="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I";
  const PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";

  let allData = [], currentId = null, player = null, progressInterval = null;
  let isNoteEditMode = true, showFavoritesOnly = false;
  
  let favorites = new Set(JSON.parse(localStorage.getItem('mc_favorites') || '[]'));
  let progressMap = JSON.parse(localStorage.getItem('mc_progress') || '{}');
  let watchedHistory = new Set(JSON.parse(localStorage.getItem('mc_watched') || '[]'));
  let notesMap = JSON.parse(localStorage.getItem('mc_notes') || '{}');
  let stats = JSON.parse(localStorage.getItem('mc_stats') || '{"totalSeconds":0, "streak":0, "lastVisit":""}');

  function onYouTubeIframeAPIReady() { initApp(); }

  async function initApp() {
    await loadData();
    player = new YT.Player('player-placeholder', {
      height: '100%', width: '100%', videoId: '',
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1, 'enablejsapi': 1 },
      events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
    });
    updateStreak();
  }

  function onPlayerReady() {
    const urlParams = new URLSearchParams(window.location.search);
    const v = urlParams.get('v');
    if (v) playVideo(v, false, parseInt(urlParams.get('t')) || 0);
    else if (localStorage.getItem('lastWatched')) cueVideo(localStorage.getItem('lastWatched'), progressMap[localStorage.getItem('lastWatched')] || 0);
  }

  function playVideo(id, autoScroll, time = null) {
    currentId = id; localStorage.setItem('lastWatched', id);
    const item = allData.find(d => d.id === id);
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    loadNotes(id);
    let start = (time !== null) ? time : (progressMap[id] || 0);
    if (player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: start });
    renderList(allData);
    if(autoScroll) {
      const card = document.getElementById("player-card");
      window.scrollTo({top: card.getBoundingClientRect().top + window.pageYOffset - 20, behavior: 'smooth'});
    }
  }

  function cueVideo(id, time) {
    currentId = id; const item = allData.find(d => d.id === id);
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    loadNotes(id);
    if(player && player.cueVideoById) player.cueVideoById({videoId: id, startSeconds: time});
    renderList(allData);
  }

  function loadNotes(id) {
    const text = notesMap[id] || "";
    document.getElementById("notes-input").value = text;
    updateNotesDisplay(text);
  }

  function updateNotesDisplay(text) {
    const html = text.replace(/\[(\d+):(\d+)\]/g, (match, m, s) => {
        const total = parseInt(m) * 60 + parseInt(s);
        return `<span class="ts-link" onclick="seekTo(${total})">${match}</span>`;
    });
    document.getElementById("notes-display").innerHTML = html || "No notes yet.";
  }

  window.toggleNoteMode = function() {
    isNoteEditMode = !isNoteEditMode;
    const input = document.getElementById("notes-input");
    const display = document.getElementById("notes-display");
    const btn = document.getElementById("note-mode-btn");
    if(isNoteEditMode) {
      input.style.display = 'block'; display.style.display = 'none'; btn.innerHTML = '👁️ View';
    } else {
      updateNotesDisplay(input.value);
      input.style.display = 'none'; display.style.display = 'block'; btn.innerHTML = '✏️ Edit';
    }
  }

  window.insertTimestamp = function() {
    const t = Math.floor(player.getCurrentTime());
    const ts = `[${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}] `;
    const input = document.getElementById("notes-input");
    input.value += ts;
    notesMap[currentId] = input.value;
    localStorage.setItem('mc_notes', JSON.stringify(notesMap));
  }

  window.seekTo = function(sec) { player.seekTo(sec, true); player.playVideo(); }

  document.getElementById("notes-input").oninput = (e) => {
    if(!currentId) return;
    notesMap[currentId] = e.target.value;
    localStorage.setItem('mc_notes', JSON.stringify(notesMap));
  };

  async function loadData() {
    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}`);
      const data = await res.json();
      allData = data.items.map(item => ({
        id: item.contentDetails.videoId, title: item.snippet.title,
        dateNice: new Date(item.contentDetails.videoPublishedAt).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"})
      }));
      renderList(allData);
      document.getElementById("skeleton").style.display = "none";
      document.getElementById("player-content").style.display = "block";
    } catch(e) { console.error(e); }
  }

  function renderList(items) {
    const list = document.getElementById("shiur-list");
    list.innerHTML = "";
    const filter = document.getElementById("search-input").value.toLowerCase();
    items.forEach(item => {
      if(!item.title.toLowerCase().includes(filter)) return;
      if(showFavoritesOnly && !favorites.has(item.id)) return;
      const li = document.createElement("li");
      const prog = (progressMap[item.id] || 0) / 2700 * 100;
      li.className = `item ${item.id === currentId ? 'active' : ''}`;
      li.innerHTML = `
        <div class="item-thumb"><img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg"><div class="item-progress" style="width:${Math.min(prog,100)}%"></div></div>
        <div class="item-body"><div class="item-title">${item.title}</div><div class="item-date">${item.dateNice}</div></div>`;
      li.onclick = () => playVideo(item.id, true);
      list.appendChild(li);
    });
  }

  function onPlayerStateChange(e) {
    if (e.data === 1) {
      progressInterval = setInterval(() => {
        const t = Math.floor(player.getCurrentTime());
        if(t > 2) { progressMap[currentId] = t; localStorage.setItem('mc_progress', JSON.stringify(progressMap)); stats.totalSeconds += 1; localStorage.setItem('mc_stats', JSON.stringify(stats)); }
      }, 1000);
      document.getElementById("dm-play-icon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      watchedHistory.add(currentId); localStorage.setItem('mc_watched', JSON.stringify([...watchedHistory]));
    } else {
      clearInterval(progressInterval);
      document.getElementById("dm-play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  window.setSpeed = function(s, btn) { 
    player.setPlaybackRate(s);
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  window.toggleDrivingMode = function() {
    const el = document.getElementById("driving-mode");
    isDrivingMode = !isDrivingMode;
    el.classList.toggle('active', isDrivingMode);
    document.getElementById("dm-title").textContent = allData.find(d => d.id === currentId)?.title || "No Shiur";
  }

  window.togglePlay = function() { player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
  window.seek = function(s) { player.seekTo(player.getCurrentTime() + s, true); }
  window.openStats = function() { 
    document.getElementById('stat-streak').textContent = stats.streak;
    document.getElementById('stat-hours').textContent = (stats.totalSeconds/3600).toFixed(1);
    document.getElementById('stat-completed').textContent = watchedHistory.size;
    document.getElementById('stats-overlay').classList.add('active'); 
  }
  window.closeOverlay = (id) => document.getElementById(id).classList.remove('active');
  function updateStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastVisit !== today) { stats.streak = (stats.lastVisit === new Date(Date.now()-86400000).toISOString().split('T')[0]) ? stats.streak + 1 : 1; stats.lastVisit = today; localStorage.setItem('mc_stats', JSON.stringify(stats)); }
  }
  document.getElementById("search-input").oninput = () => renderList(allData);
  function toggleFavFilter() { showFavoritesOnly = !showFavoritesOnly; document.getElementById("fav-btn").classList.toggle('active'); renderList(allData); }
  document.getElementById("theme-toggle").onclick = () => { document.body.classList.toggle("dark-mode"); };
  window.onscroll = () => document.getElementById("back-to-top").style.display = window.scrollY > 400 ? "block" : "none";
</script>
</body>
</html>
