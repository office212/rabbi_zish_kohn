<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim Staten Island</title>
  
  <meta property="og:title" content="Mekor Chaim Staten Island - Weekly Shiur">
  <meta property="og:description" content="Listen to weekly shiurim by Rabbi Zish Kohn.">
  <meta property="og:image" content="https://office212.github.io/rabbi_zish_kohn/icon-512(1).png">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- VARIABLES --- */
    :root {
      --w: 1000px;
      --bg-main: #f8fafc; --card-bg: #ffffff; --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.15);
      --text-main: #0f172a; --text-muted: #64748b; --border-soft: #e2e8f0;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --fav-color: #ef4444; --watched-color: #10b981;
    }
    body.dark-mode {
      --bg-main: #020617; --card-bg: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
      --border-soft: #1e293b; --accent: #60a5fa; --accent-glow: rgba(96, 165, 250, 0.2);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3); --header-bg: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main);
      padding-bottom: 80px; transition: background 0.3s ease, color 0.3s ease; -webkit-tap-highlight-color: transparent;
    }

    header, main, footer { max-width: var(--w); margin: 0 auto; padding: 0 16px; }
    header { padding-top: 20px; padding-bottom: 24px; }
    .layout { margin-top: 10px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: flex-start; }
    @media(max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    /* HEADER */
    .header-inner { background: var(--header-bg); border-radius: 24px; padding: 24px 28px; color: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
    h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .sub { font-size: 0.95rem; opacity: 0.9; margin-top: 6px; }
    .header-controls { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* BUTTONS */
    button { font-family: inherit; }
    .theme-toggle, .install-btn, .drive-mode-btn, .stats-btn { border-radius: 99px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: none; }
    
    .theme-toggle { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; min-width: 130px; justify-content: center; }
    .install-btn { background: white; color: var(--accent); padding: 8px 16px; display: none; }
    .drive-mode-btn { background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; }
    .stats-btn { background: rgba(255,255,255,0.9); color: var(--accent); padding: 8px 16px; }

    /* SHARE */
    .share-container { position: relative; }
    .share-btn { background: #ecfdf5; color: #059669; border: 1px solid #d1fae5; border-radius: 99px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .share-menu { position: absolute; top: 100%; right: 0; margin-top: 8px; background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; flex-direction: column; min-width: 160px; z-index: 50; }
    .share-menu.show { display: flex; }
    .share-menu button { background: none; border: none; padding: 12px; text-align: left; cursor: pointer; font-size: 0.9rem; color: var(--text-main); border-bottom: 1px solid var(--border-soft); }

    /* PLAYER CARD */
    .player-card { background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); position: relative; overflow: hidden; }
    .player-header { padding: 20px; border-bottom: 1px solid var(--border-soft); }
    .player-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px; line-height: 1.3; }
    .badge-main { background: var(--accent-glow); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .frame { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    #player-placeholder { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* NOTES */
    .notes-section { padding: 20px; background: var(--bg-main); border-top: 1px solid var(--border-soft); }
    .notes-header { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .notes-input { width: 100%; min-height: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.9rem; background: var(--card-bg); color: var(--text-main); resize: vertical; display: block; }
    .notes-display { width: 100%; min-height: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.9rem; background: var(--bg-main); color: var(--text-main); white-space: pre-wrap; display: none; line-height: 1.5; }
    .ts-link { color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; background: var(--accent-glow); padding: 2px 4px; border-radius: 4px; margin: 0 2px; }
    .tool-btn { background: transparent; border: 1px solid var(--border-soft); color: var(--text-muted); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .tool-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }

    /* LIST */
    .list-card { margin-top: 0; }
    .list-header { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-soft); display: flex; gap: 12px; flex-wrap: wrap; }
    .filters input { border-radius: 12px; border: 1px solid var(--border-soft); padding: 10px 14px; font-size: 0.9rem; background: var(--bg-main); color: var(--text-main); outline: none; flex: 1; }
    
    .list { list-style: none; margin: 0; padding: 0; }
    .item { display: flex; gap: 16px; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .item.watched { opacity: 0.8; }
    .item-thumb { flex: 0 0 130px; position: relative; border-radius: 10px; overflow: hidden; background: #000; }
    .item-thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
    .item-progress-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(0,0,0,0.2); }
    .item-progress-fill { height: 100%; background: var(--watched-color); width: 0%; transition: width 0.3s; }
    .item-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
    .item-title { font-size: 1rem; font-weight: 600; color: var(--text-main); line-height: 1.4; }
    .item-date { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }

    /* OVERLAYS - FIXED DISPLAY ISSUES */
    .overlay-fixed { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .overlay-fixed.active { display: flex !important; }
    
    .modal-box { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 24px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: transparent; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.2rem; }

    /* DRIVING MODE */
    #driving-mode { background: #000; flex-direction: column; }
    .dm-title { font-size: 1.1rem; margin-bottom: 40px; text-align: center; color: #9ca3af; padding: 0 20px; font-weight: 500; }
    .dm-controls { display: flex; gap: 25px; align-items: center; margin-bottom: 50px; }
    .dm-btn { width: 85px; height: 85px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .dm-btn span { font-size: 0.7rem; margin-top: 4px; font-weight: 700; }
    .dm-btn.play-pause { width: 110px; height: 110px; background: var(--accent); border: none; box-shadow: 0 0 30px rgba(37, 99, 235, 0.4); }
    .dm-btn svg { width: 32px; height: 32px; fill: white; }
    .dm-btn.play-pause svg { width: 45px; height: 45px; }

    /* UTILS */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; opacity: 0; transition: 0.4s; z-index: 10000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #back-to-top { position: fixed; bottom: 30px; right: 20px; padding: 12px 18px; border-radius: 99px; background: var(--text-main); color: var(--bg-main); border: none; font-weight: 600; display: none; z-index: 50; cursor: pointer; }
    
    .skeleton-wrapper { padding: 20px; }
    .skel-video { border-radius: 20px; height: 210px; width: 100%; background: var(--border-soft); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    footer { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 50px; padding-bottom: 20px; }
    .footer-credit a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

<div id="stats-overlay" class="overlay-fixed" aria-hidden="true">
  <div class="modal-box">
    <button class="modal-close" onclick="closeOverlay('stats-overlay')">✕</button>
    <h3 style="margin:0 0 20px; text-align:center;">My Torah Stats 📊</h3>
    <div style="display:flex; justify-content:space-around; text-align:center;">
      <div><span id="stat-streak" style="font-size:1.8rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Day Streak</span></div>
      <div><span id="stat-hours" style="font-size:1.8rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Hours Learned</span></div>
      <div><span id="stat-completed" style="font-size:1.8rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Watched</span></div>
    </div>
  </div>
</div>

<div id="quote-overlay" class="overlay-fixed" aria-hidden="true">
  <div class="modal-box">
    <button class="modal-close" onclick="closeOverlay('quote-overlay')">✕</button>
    <h3 style="margin:0; text-align:center;">Share a Quote 🎨</h3>
    <textarea id="quote-text" style="width:100%; height:110px; margin:20px 0; border-radius:15px; padding:12px; border:1px solid var(--border-soft); font-family:inherit;" placeholder="Type the Rabbi's quote here..."></textarea>
    <button onclick="generateAndShareQuote()" style="width:100%; background:var(--accent); color:white; border:none; padding:14px; border-radius:15px; font-weight:700; cursor:pointer;">Create & Share Image</button>
  </div>
</div>

<div id="driving-mode" class="overlay-fixed" aria-hidden="true">
  <button class="dm-close" onclick="toggleDrivingMode()">Exit Driving Mode</button>
  <div class="dm-title" id="dm-title">No Shiur Selected</div>
  <div class="dm-controls">
    <button class="dm-btn" onclick="seek(-30)">
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span>-30s</span>
    </button>
    <button class="dm-btn play-pause" onclick="togglePlay()">
      <svg id="dm-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="dm-btn" onclick="seek(30)">
      <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg><span>+30s</span>
    </button>
  </div>
  <div style="color:#4b5563; font-size:0.85rem;">Screen stays dark for safety</div>
</div>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim Staten Island</h1>
    <div class="sub">Weekly Shiurim - Rabbi Zish Kohn</div>
    <div class="header-controls">
      <button onclick="openStats()" class="stats-btn">📊 Stats</button>
      <button class="drive-mode-btn" onclick="toggleDrivingMode()">🚗 Audio Mode</button>
      <button id="theme-toggle" class="theme-toggle"><span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span></button>
    </div>
  </div>
</header>

<main>
  <div class="layout">
    <section class="player-card" id="player-card">
      <div id="skeleton" class="skeleton-wrapper"><div class="skel-video"></div></div>
      <div id="player-content" style="display:none">
        <div class="player-header">
          <h2 class="player-title" id="player-title">Select a shiur</h2>
          <div class="player-meta-row">
            <div><span class="badge-main">Torah</span> <span id="player-date" style="margin-left:8px; font-size:0.85rem; color:var(--text-muted);"></span></div>
            <div class="share-container">
              <button onclick="toggleShareMenu()" class="share-btn">Share</button>
              <div id="share-menu" class="share-menu">
                <button onclick="shareLink(false)">Standard Link</button>
                <button onclick="shareLink(true)">Start at Current Time ⏱️</button>
              </div>
            </div>
          </div>
          <div class="player-controls">
            <button class="control-btn active" onclick="setSpeed(1)">1x</button>
            <button class="control-btn" onclick="setSpeed(1.25)">1.25x</button>
            <button class="control-btn" onclick="setSpeed(1.5)">1.5x</button>
            <button class="control-btn" onclick="setSpeed(2)">2x</button>
          </div>
        </div>
        
        <div class="frame"><div id="player-placeholder"></div></div>
        
        <div class="notes-section">
          <div class="notes-header">
            <span>My Notes 📝</span>
            <div class="notes-actions">
              <button onclick="toggleNoteMode()" id="note-mode-btn" class="tool-btn primary">👁️ View</button>
              <button onclick="insertTimestamp()" class="tool-btn" id="time-btn">⏱️ Time</button>
              <button onclick="openQuoteCreator()" class="tool-btn">🎨 Quote</button>
              <button onclick="exportNotes()" class="tool-btn">💾 Export</button>
            </div>
          </div>
          <textarea id="notes-input" class="notes-input" placeholder="Write thoughts here... (Use 'Time' to add timestamps)"></textarea>
          <div id="notes-display" class="notes-display"></div>
        </div>
      </div>
    </section>

    <section class="list-card">
      <div class="list-header">
        <div class="filters" style="width:100%; display:flex; gap:10px;">
          <input id="search-input" type="search" style="width:100%" placeholder="Search topics or parsha...">
          <button id="fav-filter-btn" class="btn-fav-filter" style="border:none; border-radius:12px; cursor:pointer; font-weight:600; padding:0 15px;">Saved</button>
        </div>
      </div>
      <ul id="shiur-list" class="list"></ul>
    </section>
  </div>
</main>

<footer>
  &copy; 2026 Mekor Chaim Staten Island
  <div class="footer-credit" style="margin-top:10px;">Built by <a href="mailto:ccdesign.nys@gmail.com">CC Design</a></div>
</footer>

<button id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑ Top</button>
<div id="toast" class="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I";
  const PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";

  // State
  let allData = []; let currentId = null; let player = null; let progressInterval = null; 
  let isDrivingMode = false; let isNoteEditMode = true; let showFavoritesOnly = false;
  
  let favorites = new Set(JSON.parse(localStorage.getItem('mc_favorites') || '[]'));
  let progressMap = JSON.parse(localStorage.getItem('mc_progress') || '{}');
  let watchedHistory = new Set(JSON.parse(localStorage.getItem('mc_watched') || '[]'));
  let notesMap = JSON.parse(localStorage.getItem('mc_notes') || '{}');
  let stats = JSON.parse(localStorage.getItem('mc_stats') || '{"totalSeconds":0, "streak":0, "lastVisit":""}');

  const listEl = document.getElementById("shiur-list");
  const searchInput = document.getElementById("search-input");
  const notesInput = document.getElementById("notes-input");
  const notesDisplay = document.getElementById("notes-display");
  const noteModeBtn = document.getElementById("note-mode-btn");
  const timeBtn = document.getElementById("time-btn");

  // YouTube API
  function onYouTubeIframeAPIReady() {
    initApp();
  }

  async function initApp() {
    await loadData();
    player = new YT.Player('player-placeholder', {
      height: '100%', width: '100%', videoId: '',
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1, 'enablejsapi': 1 },
      events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
    });
    updateStreak();
  }

  function onPlayerReady() {
    const urlParams = new URLSearchParams(window.location.search);
    const v = urlParams.get('v');
    if (v) playVideo(v, false, parseInt(urlParams.get('t')) || 0);
    else if (localStorage.getItem('lastWatched')) {
        const last = localStorage.getItem('lastWatched');
        cueVideo(last, progressMap[last] || 0);
    }
  }

  // --- ACTIONS ---
  function playVideo(id, autoScroll, time = null) {
    currentId = id; localStorage.setItem('lastWatched', id);
    const item = allData.find(d => d.id === id);
    if(!item) return;
    
    // UI Update
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    loadNotes(id);
    
    const start = (time !== null) ? time : (progressMap[id] || 0);
    if (player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: start });
    
    renderList(allData);
    
    if(autoScroll) {
      const card = document.getElementById("player-card");
      window.scrollTo({top: card.getBoundingClientRect().top + window.pageYOffset - 20, behavior: 'smooth'});
    }
    
    // URL Update
    const url = new URL(window.location);
    url.searchParams.set('v', id);
    window.history.pushState({}, '', url);
  }

  function cueVideo(id, time) {
    currentId = id; const item = allData.find(d => d.id === id);
    if(!item) return;
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    loadNotes(id);
    if(player && player.cueVideoById) player.cueVideoById({videoId: id, startSeconds: time});
    renderList(allData);
  }

  // --- NOTES LOGIC ---
  function loadNotes(id) {
    const text = notesMap[id] || "";
    notesInput.value = text;
    updateNotesDisplay(text);
  }

  function updateNotesDisplay(text) {
    const html = text.replace(/\[(\d+):(\d+)\]/g, (match, m, s) => {
        const total = parseInt(m) * 60 + parseInt(s);
        return `<span class="ts-link" onclick="seekTo(${total})">${match}</span>`;
    });
    notesDisplay.innerHTML = html || "<span style='color:var(--text-muted);font-style:italic'>No notes for this shiur. Click 'View' to start editing.</span>";
  }

  window.toggleNoteMode = function() {
    isNoteEditMode = !isNoteEditMode;
    if(isNoteEditMode) {
      notesInput.style.display = 'block'; notesDisplay.style.display = 'none';
      noteModeBtn.innerHTML = '👁️ View'; timeBtn.style.display = 'flex'; notesInput.focus();
    } else {
      updateNotesDisplay(notesInput.value);
      notesInput.style.display = 'none'; notesDisplay.style.display = 'block';
      noteModeBtn.innerHTML = '✏️ Edit'; timeBtn.style.display = 'none';
    }
  }

  window.insertTimestamp = function() {
    if(!player) return;
    const t = Math.floor(player.getCurrentTime());
    const ts = `[${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}] `;
    const start = notesInput.selectionStart;
    notesInput.value = notesInput.value.substring(0, start) + ts + notesInput.value.substring(start);
    notesInput.dispatchEvent(new Event('input'));
  }

  window.seekTo = function(sec) { if(player) { player.seekTo(sec, true); player.playVideo(); } }

  notesInput.addEventListener("input", () => {
    if(!currentId) return;
    notesMap[currentId] = notesInput.value;
    localStorage.setItem('mc_notes', JSON.stringify(notesMap));
  });

  // --- STATS & OVERLAYS ---
  function updateStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastVisit !== today) {
        const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
        const yStr = yesterday.toISOString().split('T')[0];
        if (stats.lastVisit === yStr) stats.streak++; else if (stats.lastVisit !== today) stats.streak = 1;
        stats.lastVisit = today;
        localStorage.setItem('mc_stats', JSON.stringify(stats));
    }
  }

  window.openStats = function() {
    document.getElementById('stat-streak').textContent = stats.streak;
    document.getElementById('stat-hours').textContent = (stats.totalSeconds / 3600).toFixed(1);
    document.getElementById('stat-completed').textContent = watchedHistory.size;
    document.getElementById('stats-overlay').classList.add('active');
  }

  window.openQuoteCreator = function() { document.getElementById('quote-overlay').classList.add('active'); }
  window.closeOverlay = function(id) { document.getElementById(id).classList.remove('active'); }

  window.toggleDrivingMode = function() {
    isDrivingMode = !isDrivingMode;
    const el = document.getElementById("driving-mode");
    if(isDrivingMode) {
      el.classList.add('active');
      document.getElementById("dm-title").textContent = allData.find(d => d.id === currentId)?.title || "No Shiur Selected";
    } else el.classList.remove('active');
  }

  window.togglePlay = function() {
    const state = player.getPlayerState();
    if(state === 1) player.pauseVideo(); else player.playVideo();
  }
  window.seek = function(s) { player.seekTo(player.getCurrentTime() + s, true); }

  // --- DATA FETCH ---
  async function loadData() {
    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}`);
      const data = await res.json();
      allData = data.items.map(item => ({
        id: item.contentDetails.videoId, title: item.snippet.title,
        dateNice: new Date(item.contentDetails.videoPublishedAt).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"}),
        year: new Date(item.contentDetails.videoPublishedAt).getFullYear().toString()
      }));
      renderList(allData);
      document.getElementById("skeleton").style.display = "none";
      document.getElementById("player-content").style.display = "block";
    } catch(e) { console.error(e); showToast("Internet Error"); }
  }

  function renderList(items) {
    listEl.innerHTML = "";
    const filter = searchInput.value.toLowerCase();
    
    items.forEach(item => {
      if(!item.title.toLowerCase().includes(filter)) return;
      if(showFavoritesOnly && !favorites.has(item.id)) return;

      const li = document.createElement("li");
      const isWatched = watchedHistory.has(item.id);
      const isCurrent = item.id === currentId;
      const prog = (progressMap[item.id] || 0) / 2700 * 100;

      li.className = `item ${isCurrent ? 'active' : ''} ${isWatched ? 'watched' : ''}`;
      li.innerHTML = `
        <div class="item-thumb">
            <img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg">
            <div class="item-progress-bg"><div class="item-progress-fill" style="width:${Math.min(prog, 100)}%"></div></div>
        </div>
        <div class="item-body">
            <div class="item-top-row">
                <div class="item-title">${item.title}</div>
                <button class="btn-fav ${favorites.has(item.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${item.id}')">❤️</button>
            </div>
            <div class="item-date">${item.dateNice} ${isCurrent ? '<div class="equalizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>' : ''}</div>
        </div>`;
      li.onclick = () => playVideo(item.id, true);
      listEl.appendChild(li);
    });
  }

  window.toggleFav = function(id) {
    if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
    localStorage.setItem('mc_favorites', JSON.stringify([...favorites]));
    renderList(allData);
  }

  document.getElementById("fav-filter-btn").onclick = function() {
    showFavoritesOnly = !showFavoritesOnly;
    this.classList.toggle('active');
    renderList(allData);
  }

  searchInput.oninput = () => renderList(allData);

  function onPlayerStateChange(e) {
    if (e.data === 1) {
      startTracking();
      document.getElementById("dm-play-icon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      if(!watchedHistory.has(currentId)) {
        watchedHistory.add(currentId); localStorage.setItem('mc_watched', JSON.stringify([...watchedHistory]));
        renderList(allData);
      }
    } else {
      stopTracking();
      document.getElementById("dm-play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  function startTracking() {
    if(progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
      const t = Math.floor(player.getCurrentTime());
      if(t > 2) {
        progressMap[currentId] = t;
        localStorage.setItem('mc_progress', JSON.stringify(progressMap));
        stats.totalSeconds += 1;
        localStorage.setItem('mc_stats', JSON.stringify(stats));
      }
    }, 1000);
  }
  function stopTracking() { clearInterval(progressInterval); }

  window.setSpeed = function(s) { 
    player.setPlaybackRate(s);
    document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function showToast(m) { toast.textContent = m; toast.classList.add("show"); setTimeout(()=>toast.classList.remove("show"), 2000); }

  // Theme
  document.getElementById("theme-toggle").onclick = () => {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");
    document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
    document.getElementById("theme-text").textContent = isDark ? "Light Mode" : "Dark Mode";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };

  window.onscroll = () => { document.getElementById("back-to-top").style.display = window.scrollY > 400 ? "block" : "none"; };

</script>
</body>
</html>
