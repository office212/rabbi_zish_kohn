<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Weekly Shiur - Mekor Chaim SI</title>
  
  <meta property="og:title" content="Mekor Chaim Staten Island - Weekly Shiur">
  <meta property="og:description" content="Listen to weekly shiurim by Rabbi Zish Kohn.">
  <meta property="og:image" content="https://office212.github.io/rabbi_zish_kohn/icon-512(1).png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- VARIABLES --- */
    :root {
      --w: 900px;
      --bg-main: #f8fafc; --card-bg: #ffffff; --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.15);
      --text-main: #0f172a; --text-muted: #64748b; --border-soft: #e2e8f0;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --fav-color: #ef4444; --watched-color: #10b981;
    }
    body.dark-mode {
      --bg-main: #020617; --card-bg: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
      --border-soft: #1e293b; --accent: #60a5fa; --accent-glow: rgba(96, 165, 250, 0.2);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3); --header-bg: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    /* --- BASE --- */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); padding-bottom: 60px; transition: background 0.3s ease, color 0.3s ease; -webkit-tap-highlight-color: transparent; }
    header, main, footer { max-width: var(--w); margin: 0 auto; padding: 0 16px; }
    header { padding-top: 16px; padding-bottom: 16px; }
    button { font-family: inherit; cursor: pointer; border: none; }

    /* --- LAYOUT --- */
    .layout { display: flex; flex-direction: column; gap: 20px; }
    @media(min-width: 900px) { .layout { display: grid; grid-template-columns: 1.6fr 1fr; align-items: flex-start; } }

    /* --- HEADER --- */
    .header-inner { background: var(--header-bg); border-radius: 20px; padding: 20px; color: white; box-shadow: 0 8px 20px -5px rgba(37, 99, 235, 0.3); }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
    .sub { font-size: 0.85rem; opacity: 0.9; margin: 4px 0 12px; }
    .header-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-btn { border-radius: 99px; font-size: 0.75rem; font-weight: 600; padding: 6px 12px; display: inline-flex; align-items: center; gap: 5px; }
    .theme-toggle { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
    .stats-btn { background: white; color: var(--accent); }
    .drive-mode-btn { background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); }

    /* --- PLAYER CARD --- */
    .player-card { background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); overflow: hidden; }
    .player-header { padding: 16px; border-bottom: 1px solid var(--border-soft); }
    .player-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px; line-height: 1.3; }
    
    .player-meta { display: flex; flex-direction: column; gap: 10px; }
    #player-date { font-size: 0.8rem; color: var(--text-muted); }
    .speed-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .speed-btn { background: var(--bg-main); color: var(--text-muted); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; border: 1px solid var(--border-soft); flex: 1; text-align: center; max-width: 60px; }
    .speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- NOTES --- */
    .notes-section { padding: 16px; background: var(--bg-main); border-top: 1px solid var(--border-soft); }
    .notes-actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .notes-actions::-webkit-scrollbar { display: none; }
    .tool-btn { padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 5px; background: var(--card-bg); border: 1px solid var(--border-soft); color: var(--text-muted); white-space: nowrap; }
    .tool-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .notes-input, .notes-display { width: 100%; min-height: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-soft); font-family: inherit; font-size: 0.9rem; margin-top: 12px; background: var(--card-bg); line-height: 1.5; }
    .notes-display { display: none; white-space: pre-wrap; }
    .ts-link { color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; }

    /* --- LIST (RESTORED & FIXED ALIGNMENT) --- */
    .list-header { margin-bottom: 16px; display: flex; gap: 10px; }
    #search-input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-main); outline: none; font-size: 0.9rem; }
    .fav-btn { padding: 0 16px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border-soft); font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
    .fav-btn.active { color: var(--fav-color); border-color: var(--fav-color); background: #fff1f2; }
    
    .item { display: flex; gap: 16px; padding: 12px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-soft); margin-bottom: 12px; transition: 0.2s; align-items: stretch; }
    .item.active { border-color: var(--accent); background: var(--accent-glow); }
    .item-thumb { flex: 0 0 120px; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; background: #eee; align-self: flex-start; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(0,0,0,0.1); }
    .item-progress-fill { height: 100%; background: var(--watched-color); width: 0%; transition: width 0.3s; }
    
    .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 2px; }
    .item-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .item-title { font-size: 0.95rem; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-fav { padding: 4px; color: var(--border-soft); transition: 0.2s; flex-shrink: 0; }
    .btn-fav.active { color: var(--fav-color); }
    .item-date { font-size: 0.8rem; color: var(--text-muted); }

    /* --- OVERLAYS --- */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 20px; }
    .overlay.active { display: flex !important; }
    .modal { background: var(--card-bg); width: 100%; max-width: 380px; border-radius: 24px; padding: 24px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: transparent; color: var(--text-muted); font-size: 1.2rem; padding: 5px; }

    /* Driving Mode */
    #driving-mode { background: #000; flex-direction: column; }
    .dm-controls { display: flex; gap: 25px; align-items: center; margin: 40px 0; }
    .dm-btn { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.15); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.3); }
    .dm-btn.play { width: 95px; height: 95px; background: var(--accent); border: none; }
    .dm-close-btn { margin-top: 20px; background: rgba(255,255,255,0.2); color: white; padding: 10px 24px; border-radius: 99px; font-weight: 600; }

    /* Utils */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; z-index: 20000; opacity: 0; pointer-events: none; transition: 0.3s; }
    .toast.show { opacity: 1; }
    .skeleton-wrapper { padding: 20px; }
    .skel-video { border-radius: 16px; height: 200px; width: 100%; background: var(--border-soft); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    footer { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 40px; }
    
    @media(min-width: 600px) {
       .player-meta { flex-direction: row; justify-content: space-between; align-items: center; }
       .item-thumb { flex: 0 0 150px; }
    }
  </style>
</head>
<body>

<div id="driving-mode" class="overlay">
  <div style="color: #94a3b8; font-weight: 600;" id="dm-title">No Shiur Selected</div>
  <div class="dm-controls">
    <button class="dm-btn" onclick="seek(-30)">
       <svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
       <span style="font-size:0.7rem; margin-top:2px">-30s</span>
    </button>
    <button class="dm-btn play" onclick="togglePlay()">
       <svg id="dm-play-icon" width="40" height="40" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="dm-btn" onclick="seek(30)">
       <svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
       <span style="font-size:0.7rem; margin-top:2px">+30s</span>
    </button>
  </div>
  <button class="dm-close-btn" onclick="toggleDrivingMode()">Exit Driving Mode</button>
</div>

<div id="stats-overlay" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeOverlay('stats-overlay')">✕</button>
    <h3 style="text-align:center; margin:0 0 20px;">My Torah Stats 📊</h3>
    <div style="display:flex; justify-content:space-around; text-align:center;">
      <div><span id="stat-streak" style="font-size:1.5rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Streak</span></div>
      <div><span id="stat-hours" style="font-size:1.5rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Hours</span></div>
      <div><span id="stat-completed" style="font-size:1.5rem; font-weight:800; color:var(--accent); display:block;">0</span><span style="font-size:0.7rem; color:var(--text-muted);">Watched</span></div>
    </div>
  </div>
</div>

<div id="quote-overlay" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeOverlay('quote-overlay')">✕</button>
    <h3 style="margin:0; text-align:center;">Share a Quote 🎨</h3>
    <textarea id="quote-text" style="width:100%; height:100px; margin:20px 0; border-radius:12px; padding:12px; border:1px solid var(--border-soft); font-family:inherit;" placeholder="Type the Rabbi's quote here..."></textarea>
    <button onclick="generateAndShareQuote()" style="width:100%; background:var(--accent); color:white; border:none; padding:12px; border-radius:12px; font-weight:700;">Create & Share</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <h1>Mekor Chaim SI</h1>
    <div class="sub">Rabbi Zish Kohn - Weekly Shiurim</div>
    <div class="header-controls">
      <button onclick="openStats()" class="nav-btn stats-btn">📊 Stats</button>
      <button onclick="toggleDrivingMode()" class="nav-btn drive-mode-btn">🚗 Audio Mode</button>
      <button id="theme-toggle" class="nav-btn theme-toggle">🌙 Mode</button>
    </div>
  </div>
</header>

<main>
  <div class="layout">
    <section class="player-card" id="player-card">
      <div id="skeleton" class="skeleton-wrapper"><div class="skel-video"></div></div>
      <div id="player-content" style="display:none">
        <div class="player-header">
          <h2 class="player-title" id="player-title">Select a shiur</h2>
          <div class="player-meta">
            <span id="player-date"></span>
            <div class="speed-btns">
              <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
              <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25x</button>
              <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5x</button>
              <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
            </div>
          </div>
        </div>
        <div class="video-container"><div id="player-placeholder"></div></div>
        <div class="notes-section">
          <div class="notes-actions">
            <button onclick="toggleNoteMode()" id="note-mode-btn" class="tool-btn primary">👁️ View</button>
            <button onclick="insertTimestamp()" id="time-btn" class="tool-btn">⏱️ Time</button>
            <button onclick="openQuoteCreator()" class="tool-btn">🎨 Quote</button>
            <button onclick="exportNotes()" class="tool-btn">💾 Export</button>
          </div>
          <textarea id="notes-input" class="notes-input" placeholder="Write thoughts... use 'Time' for bookmarks."></textarea>
          <div id="notes-display" class="notes-display"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="list-header">
        <input id="search-input" type="search" placeholder="Search topics or dates...">
        <button id="fav-btn" class="fav-btn" onclick="toggleFavFilter()">Saved ❤️</button>
      </div>
      <ul id="shiur-list" class="list"></ul>
    </section>
  </div>
</main>

<footer>&copy; 2026 Mekor Chaim • Built by CC Design</footer>
<div id="toast" class="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const API_KEY = "AIzaSyCTwayKPsc9hlF-ewhl_23DB8fbG7N3k4I";
  const PLAYLIST_ID = "PL5_QJLfJsSyaMFbbQVSWX5TY6nL0Snm3q";

  let allData = [], currentId = null, player = null, progressInterval = null;
  let isNoteEditMode = true, isDrivingMode = false, showFavoritesOnly = false;
  
  let favorites = new Set(JSON.parse(localStorage.getItem('mc_favorites') || '[]'));
  let progressMap = JSON.parse(localStorage.getItem('mc_progress') || '{}');
  let watchedHistory = new Set(JSON.parse(localStorage.getItem('mc_watched') || '[]'));
  let notesMap = JSON.parse(localStorage.getItem('mc_notes') || '{}');
  let stats = JSON.parse(localStorage.getItem('mc_stats') || '{"totalSeconds":0, "streak":0, "lastVisit":""}');

  function onYouTubeIframeAPIReady() { initApp(); }

  async function initApp() {
    await loadData();
    player = new YT.Player('player-placeholder', {
      height: '100%', width: '100%', videoId: '',
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1 },
      events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
    });
    updateStreak();
  }

  function onPlayerReady() {
    const urlParams = new URLSearchParams(window.location.search);
    const v = urlParams.get('v');
    if (v) playVideo(v, false, parseInt(urlParams.get('t')) || 0);
    else if (localStorage.getItem('lastWatched')) playVideo(localStorage.getItem('lastWatched'), false);
  }

  function playVideo(id, autoScroll, time = null) {
    currentId = id; localStorage.setItem('lastWatched', id);
    const item = allData.find(d => d.id === id);
    if(!item) return;
    document.getElementById("player-title").textContent = item.title;
    document.getElementById("player-date").textContent = item.dateNice;
    loadNotes(id);
    let start = (time !== null) ? time : (progressMap[id] || 0);
    if (player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: start });
    renderList(allData);
    if(autoScroll) {
      const card = document.getElementById("player-card");
      window.scrollTo({top: card.getBoundingClientRect().top + window.pageYOffset - 20, behavior: 'smooth'});
    }
  }

  function loadNotes(id) {
    const text = notesMap[id] || "";
    document.getElementById("notes-input").value = text;
    updateNotesDisplay(text);
  }

  function updateNotesDisplay(text) {
    const html = text.replace(/\[(\d+):(\d+)\]/g, (match, m, s) => {
        const total = parseInt(m) * 60 + parseInt(s);
        return `<span class="ts-link" onclick="seekTo(${total})">${match}</span>`;
    });
    document.getElementById("notes-display").innerHTML = html || "No notes yet.";
  }

  window.toggleNoteMode = function() {
    isNoteEditMode = !isNoteEditMode;
    const input = document.getElementById("notes-input"), display = document.getElementById("notes-display"), btn = document.getElementById("note-mode-btn"), timeBtn = document.getElementById("time-btn");
    if(isNoteEditMode) { 
      input.style.display = 'block'; display.style.display = 'none'; btn.innerHTML = '👁️ View'; timeBtn.style.display = 'flex';
    } else { 
      updateNotesDisplay(input.value); input.style.display = 'none'; display.style.display = 'block'; btn.innerHTML = '✏️ Edit'; timeBtn.style.display = 'none';
    }
  }

  window.insertTimestamp = function() {
    if(!player) return;
    const t = Math.floor(player.getCurrentTime());
    const ts = `[${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}] `;
    const input = document.getElementById("notes-input");
    input.value += ts;
    notesMap[currentId] = input.value;
    localStorage.setItem('mc_notes', JSON.stringify(notesMap));
  }

  window.seekTo = function(sec) { if(player) { player.seekTo(sec, true); player.playVideo(); } }

  document.getElementById("notes-input").oninput = (e) => {
    if(!currentId) return;
    notesMap[currentId] = e.target.value;
    localStorage.setItem('mc_notes', JSON.stringify(notesMap));
  };

  window.exportNotes = function() {
    if(!currentId) return;
    const text = notesMap[currentId] || "";
    if(!text) { showToast("No notes to export"); return; }
    const item = allData.find(d => d.id === currentId);
    const title = item ? item.title : "Shiur Notes";
    const fullText = `Notes for: ${title}\nDate: ${item ? item.dateNice : ""}\n\n${text}`;
    if(navigator.share) { navigator.share({ title: title, text: fullText }).catch(console.error); } 
    else {
      const blob = new Blob([fullText], {type: 'text/plain'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'notes.txt'; a.click();
    }
  }

  async function loadData() {
    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}`);
      const data = await res.json();
      allData = data.items.map(item => ({
        id: item.contentDetails.videoId, title: item.snippet.title,
        dateNice: new Date(item.contentDetails.videoPublishedAt).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"})
      }));
      renderList(allData);
      document.getElementById("skeleton").style.display = "none";
      document.getElementById("player-content").style.display = "block";
    } catch(e) { console.error(e); }
  }

  // RESTORED RENDER LIST WITH HEARTS
  function renderList(items) {
    const list = document.getElementById("shiur-list");
    list.innerHTML = "";
    const filter = document.getElementById("search-input").value.toLowerCase();
    items.forEach(item => {
      if(!item.title.toLowerCase().includes(filter)) return;
      if(showFavoritesOnly && !favorites.has(item.id)) return;

      const li = document.createElement("li");
      const prog = (progressMap[item.id] || 0) / 2700 * 100; 
      const isFav = favorites.has(item.id);

      li.className = `item ${item.id === currentId ? 'active' : ''}`;
      li.innerHTML = `
        <div class="item-thumb">
          <img src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg">
          <div class="item-progress-container"><div class="item-progress-fill" style="width:${Math.min(prog,100)}%"></div></div>
        </div>
        <div class="item-body">
          <div class="item-top-row">
            <div class="item-title">${item.title}</div>
            <button class="btn-fav ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${item.id}')">
              <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </div>
          <div class="item-date">${item.dateNice}</div>
        </div>`;
      li.onclick = () => playVideo(item.id, true);
      list.appendChild(li);
    });
  }

  window.toggleFav = function(id) {
    if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
    localStorage.setItem('mc_favorites', JSON.stringify([...favorites]));
    renderList(allData);
  }

  function toggleFavFilter() { 
    showFavoritesOnly = !showFavoritesOnly; 
    document.getElementById("fav-btn").classList.toggle('active'); 
    renderList(allData); 
  }

  function onPlayerStateChange(e) {
    if (e.data === 1) {
      progressInterval = setInterval(() => {
        const t = Math.floor(player.getCurrentTime());
        if(t > 5) { 
          progressMap[currentId] = t; 
          localStorage.setItem('mc_progress', JSON.stringify(progressMap)); 
          stats.totalSeconds += 5; 
          localStorage.setItem('mc_stats', JSON.stringify(stats));
          renderList(allData); 
        }
      }, 5000); 
      document.getElementById("dm-play-icon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      watchedHistory.add(currentId); localStorage.setItem('mc_watched', JSON.stringify([...watchedHistory]));
    } else { 
      clearInterval(progressInterval);
      document.getElementById("dm-play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  window.setSpeed = function(s, btn) { 
    player.setPlaybackRate(s);
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  window.toggleDrivingMode = function() {
    const el = document.getElementById("driving-mode");
    isDrivingMode = !isDrivingMode;
    el.classList.toggle('active', isDrivingMode);
    if(isDrivingMode) document.getElementById("dm-title").textContent = allData.find(d => d.id === currentId)?.title || "No Shiur Selected";
  }

  window.togglePlay = function() { player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
  window.seek = function(s) { player.seekTo(player.getCurrentTime() + s, true); }
  
  window.openStats = function() { 
    document.getElementById('stat-streak').textContent = stats.streak;
    document.getElementById('stat-hours').textContent = (stats.totalSeconds/3600).toFixed(1);
    document.getElementById('stat-completed').textContent = watchedHistory.size;
    document.getElementById('stats-overlay').classList.add('active'); 
  }

  window.openQuoteCreator = function() { document.getElementById('quote-overlay').classList.add('active'); }
  window.closeOverlay = (id) => document.getElementById(id).classList.remove('active');
  
  window.generateAndShareQuote = function() {
    const text = document.getElementById('quote-text').value;
    if(!text.trim()) { showToast("Please write a quote first"); return; }
    const canvas = document.createElement('canvas'); canvas.width = 1080; canvas.height = 1080; const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 1080); gradient.addColorStop(0, '#1e3a8a'); gradient.addColorStop(1, '#172554'); ctx.fillStyle = gradient; ctx.fillRect(0,0,1080,1080);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 10; ctx.strokeRect(40,40,1000,1000);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 60px Inter, sans-serif'; ctx.textAlign = 'center';
    wrapText(ctx, text, 540, 400, 900, 80);
    ctx.fillStyle = '#93c5fd'; ctx.font = '40px Inter, sans-serif'; ctx.fillText("Rabbi Zish Kohn", 540, 800);
    ctx.font = '30px Inter, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText("Mekor Chaim Staten Island", 540, 900);
    canvas.toBlob(blob => {
        const file = new File([blob], "quote.png", {type: "image/png"});
        if(navigator.share) { navigator.share({files: [file]}).catch(console.error); } 
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'quote.png'; a.click(); }
        closeOverlay('quote-overlay');
    });
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' '); let line = '';
    for(let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) { ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight; } else { line = testLine; }
    } ctx.fillText(line, x, y);
  }

  function updateStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastVisit !== today) {
      const yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];
      stats.streak = (stats.lastVisit === yesterday) ? stats.streak + 1 : 1;
      stats.lastVisit = today; localStorage.setItem('mc_stats', JSON.stringify(stats));
    }
  }

  function showToast(m) { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
  document.getElementById("search-input").oninput = () => renderList(allData);
  document.getElementById("theme-toggle").onclick = () => document.body.classList.toggle("dark-mode");
</script>
</body>
</html>
